<!doctype html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prenolia Admin – Ordini</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--logo:url("/brand/prenolia-dark.png");
  --bg:#050608; --bg2:#0A0D12; --card:#0E131B; --card2:#161D29; --line:#1C2532; --line2:#2A3648;
  --ink:#F9F6F0; --muted:#9BA6B5;
  --accent:#2DD2DC; --on-accent:#031016; --accent-soft:#0B2C33; --accent-ink:#A5EDF2;
  --green:#3FE08A; --green-soft:#0F2E20; --amber:#F5C15E; --amber-soft:#3A2E10; --red:#FF8A8A; --red-soft:#3A1616;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{--logo:url("/brand/prenolia-dark.png");}
html{background:var(--bg);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,p{margin:0;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px;}
.logo{display:block;width:120px;height:30px;background:var(--logo) center / contain no-repeat;}

.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
.top-row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;}
.spacer{flex:1;}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 100px;}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
@media (min-width:820px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);}
.kpi .lbl{font-size:.85rem;color:var(--muted);font-weight:500;}
.kpi .val{margin-top:8px;font-size:1.9rem;font-weight:700;letter-spacing:-0.03em;}
.kpi .val.warn{color:var(--amber);}
.kpi .val.bad{color:var(--red);}
.kpi .sub{margin-top:4px;font-size:.8rem;color:var(--muted);}

.toolbar{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.search{flex:1;min-width:200px;position:relative;}
.search input{width:100%;min-height:46px;padding:0 16px 0 40px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.98rem;}
.search input:focus{outline:none;border-color:var(--accent);}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.filter{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.94rem;}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:.96rem;font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.08);}

.tablewrap{margin-top:18px;border-radius:22px;border:1px solid var(--line);background:var(--card);overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:1240px;}
th{text-align:left;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.who{display:flex;align-items:center;gap:12px;}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;}
.who b{display:block;font-size:.98rem;font-weight:600;white-space:nowrap;}
.who span{display:block;font-size:.8rem;color:var(--muted);}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;}
.pill.active{background:var(--green-soft);color:var(--green);}
.pill.trial{background:var(--accent-soft);color:var(--accent-ink);}
.pill.warn{background:var(--amber-soft);color:var(--amber);}
.pill.bad{background:var(--red-soft);color:var(--red);}
.plan-name{font-size:.9rem;color:var(--muted);margin-top:3px;}
.renew{font-weight:600;font-size:.94rem;}
.renew.warn{color:var(--amber);} .renew.bad{color:var(--red);}
.renew small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:1px;}
.mrr{font-weight:700;font-variant-numeric:tabular-nums;}
.appts{font-variant-numeric:tabular-nums;}
.contact a{display:block;color:var(--muted);font-size:.86rem;text-decoration:none;}
.contact a:hover{color:var(--accent-ink);}
.empty-row td{text-align:center;color:var(--muted);padding:40px 20px;}

/* pannello "nuovo cliente" */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card2);border-radius:26px 26px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.sheet.on{transform:translateY(0);}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 18px;}
.sheet h2{font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;}
.field{margin-top:16px;display:grid;gap:7px;}
.field label{font-size:.88rem;font-weight:500;color:var(--muted);}
.inp,select.inp{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sheet-actions{margin-top:22px;display:flex;gap:10px;}
.sheet-actions .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2);}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{transition:none;}}
nav{display:flex;gap:4px;}
nav a{padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;}
nav a.on{background:var(--card2);color:var(--ink);}
.pill.na{background:var(--card2);color:var(--muted);}
.health-reasons{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;max-width:240px;white-space:normal;line-height:1.35;}
.health-up{margin-top:6px;}
.svc-sub{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;white-space:normal;max-width:190px;line-height:1.35;}
.btn.small{min-height:36px;padding:0 14px;font-size:.86rem;border-radius:11px;}
.btn.danger{background:transparent;color:#FF8A8A;box-shadow:inset 0 0 0 1.5px #5A2A2A;}
.act-btn{justify-content:center;width:100%;}
</style>
<style>
/* ===== Richieste dei clienti ===== */
.reqs{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.req{padding:18px 20px;border-radius:22px;border:1px solid var(--line);background:var(--card)}
.req.new{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}
.req.danger{border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.req.done{opacity:.72}
.req-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.req-top .when{margin-left:auto;font-size:.82rem;color:var(--muted);white-space:nowrap}
.kind{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.kind.support{background:var(--accent-soft);color:var(--accent-ink)}
.kind.plan_change{background:var(--amber-soft);color:var(--amber)}
.kind.subscription_cancel{background:var(--amber-soft);color:var(--amber)}
.kind.account_delete{background:var(--red-soft);color:var(--red)}
.kind.whatsapp_activation{background:var(--green-soft);color:var(--green)}
.st{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.st.new{background:var(--green-soft);color:var(--green)}
.st.in_progress{background:var(--amber-soft);color:var(--amber)}
.st.done{background:var(--card2);color:var(--muted)}
.req-biz{margin-top:14px;display:flex;align-items:center;gap:12px}
.req-biz b{display:block;font-size:1.02rem;font-weight:650}
.req-biz b a{color:inherit;text-decoration:none}
.req-biz b a:hover{color:var(--accent-ink)}
.req-biz span.sub{display:block;font-size:.82rem;color:var(--muted)}
.req-body{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}
.req-body .topic{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.req-body p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.98rem;line-height:1.5}
.req-body p.dim{color:var(--muted)}
.req-body .more{margin-top:8px;border:0;background:none;padding:0;color:var(--accent-ink);font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}
.req-warn{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--red-soft);color:#ffc2c2;font-size:.9rem;line-height:1.45}
.req-contact{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.req-contact .who-c{font-size:.92rem;color:var(--ink);margin-right:6px}
.req-contact .who-c small{display:block;color:var(--muted);font-size:.76rem}
.btn.small{min-height:38px;padding:0 14px;font-size:.88rem;border-radius:12px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.wa{background:#25D366;color:#04210f}
.btn.danger{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 40%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.req-act{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.req-act .handled{margin-left:auto;font-size:.8rem;color:var(--muted)}
.req-empty{padding:56px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:22px}
.req-empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.banner{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--amber-soft);color:var(--amber);font-size:.92rem;line-height:1.5}
.nav-badge{display:inline-block;min-width:20px;height:20px;margin-left:7px;padding:0 6px;border-radius:999px;background:var(--red);color:#2a0a0a;font-size:.74rem;font-weight:800;line-height:20px;text-align:center;vertical-align:1px}
@media(max-width:640px){.req{padding:16px}.req-top .when{margin-left:0;width:100%}.req-act .handled{margin-left:0;width:100%}}
</style>
<style>
.req.paid{border-color:rgba(63,224,138,.35)}
.req.shipped,.req.cancelled{opacity:.78}
.kind.order{background:rgba(75,179,214,.14);color:#8CD3EA}
.st.paid{background:rgba(63,224,138,.14);color:#3FE08A}
.st.shipped{background:rgba(155,166,181,.16);color:#B7C1CE}
.st.cancelled{background:rgba(255,138,138,.12);color:#FF8A8A}
.ord-items{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.ord-items li{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}
.ord-items li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.ord-items .opt{display:block;color:var(--muted);font-size:.8rem}
.ord-tot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:800}
.ord-ship{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:.9rem;line-height:1.55}
.ord-ship b{display:block;margin-bottom:2px}
.ord-ship .note{color:var(--muted);font-size:.84rem;margin-top:4px}
.ord-print{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.ord-print summary{padding:11px 14px;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted);list-style-position:inside}
.ord-print[open] summary{color:var(--ink);border-bottom:1px solid var(--line)}
.ord-print dl{margin:0;padding:12px 14px;display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.88rem}
.ord-print dt{color:var(--muted)}.ord-print dd{margin:0;word-break:break-word}
.ord-print .copyrow{padding:0 14px 12px}
</style>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><span class="logo" role="img" aria-label="Prenolia"></span></div>
    <nav id="mainNav">
      <a href="/admin/clienti.html">I tuoi clienti</a>
      <a href="/admin/richieste.html">Richieste</a>
      <a href="/admin/ordini.html" class="on">Ordini</a>
      <a href="/admin/">Andamento</a>
      <a href="/admin/lia.html">Uso di Lia</a>
      <a href="/admin/soldi.html">Soldi</a>
      <a href="/admin/costi.html">Costi</a>
    </nav>
    <div class="spacer"></div>
  </div>
</header>
<script src="/admin/auth.js"></script>
<script src="/admin/nav.js"></script>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search" type="text" placeholder="Cerca per attività, numero ordine o nome…">
    </div>
    <select class="filter" id="filterStatus" aria-label="Stato">
      <option value="open">Da gestire</option>
      <option value="new">Da incassare</option>
      <option value="paid">Da spedire</option>
      <option value="shipped">Spediti</option>
      <option value="cancelled">Annullati</option>
      <option value="all">Tutti</option>
    </select>
    <button class="btn ghost" id="reload" type="button">Aggiorna</button>
  </div>

  <div class="banner" id="setup" hidden>La tabella degli ordini non esiste ancora. Esegui in Supabase lo script SQL dello Shop (<b>20261008_shop.sql</b>) e poi tocca Aggiorna.</div>
  <div class="reqs" id="reqs" aria-live="polite"></div>
</div>

<script>
(function(){
  var STATUS = { new:'Da incassare', paid:'Pagato', shipped:'Spedito', cancelled:'Annullato' };
  var DAYS = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
  var MONTHS = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var state = { all: [], counts: { new:0, paid:0, shipped:0, cancelled:0 }, owner: false, loaded: false };

  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function two(n){ return ('0' + n).slice(-2); }
  function eur(n){ return Number(n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' \u20ac'; }
  function dateShort(iso){ var d = new Date(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); }
  function dateFull(iso){ var d = new Date(iso); return dateShort(iso) + ', ' + two(d.getHours()) + ':' + two(d.getMinutes()); }
  function ago(iso){
    var d = new Date(iso), ms = Date.now() - d.getTime(), m = Math.floor(ms / 60000);
    if (m < 1) return 'adesso';
    if (m < 60) return m + ' min fa';
    var h = Math.floor(m / 60); if (h < 24 && d.toDateString() === new Date().toDateString()) return h === 1 ? '1 ora fa' : h + ' ore fa';
    var y = new Date(Date.now() - 86400000); if (d.toDateString() === y.toDateString()) return 'ieri alle ' + two(d.getHours()) + ':' + two(d.getMinutes());
    var g = Math.floor(ms / 86400000); if (g < 7) return g + ' giorni fa';
    return dateShort(iso);
  }
  function digits(raw){
    var s = String(raw || '').trim(); if (!s || s.indexOf('@') !== -1) return '';
    var d = s.replace(/[^0-9+]/g, ''); if (d.indexOf('+') > 0) d = d.replace(/\+/g, '');
    d = d.replace(/^\+/, ''); if (d.indexOf('00') === 0) d = d.slice(2);
    else if (/^3\d{8,9}$/.test(d)) d = '39' + d;
    return d.length >= 9 && d.length <= 15 ? d : '';
  }
  function api(path, opts){ return window.liaApi(path, opts); }
  function banner(msg){ if (window.liaBanner) window.liaBanner(msg); else alert(msg); }
  function copy(text, btn, label){
    function ok(){ var t = btn.textContent; btn.textContent = 'Copiato'; setTimeout(function(){ btn.textContent = label || t; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function(){ banner('Non riesco a copiare: selezionalo a mano.'); });
    else { var ta = el('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { banner('Non riesco a copiare.'); } ta.remove(); }
  }
  function itemLabel(it){
    var o = [];
    if (it.model) o.push(it.model === 'qr' ? 'Con QR' : 'Con orari e contatti');
    o.push(it.color === 'scuro' ? 'Scuro' : 'Chiaro');
    return o.join(' \u00b7 ');
  }
  function shipText(sh){
    return [sh.name, sh.address, [sh.cap, sh.city, sh.prov ? '(' + sh.prov + ')' : ''].filter(Boolean).join(' '), sh.phone ? 'Tel. ' + sh.phone : ''].filter(Boolean).join('\n');
  }
  function hoursText(hrs){
    var by = {}; (hrs || []).forEach(function(h){ var k = Number(h.weekday) - 1; (by[k] = by[k] || []).push(h.opens + '\u2013' + h.closes); });
    return DAYS.map(function(n, i){ return n + ': ' + (by[i] ? by[i].join(' e ') : 'Chiuso'); }).join('\n');
  }
  function printText(o){
    var sn = o.snapshot || {};
    return [o.code + ' \u00b7 ' + (sn.name || o.business_name || ''), sn.type ? 'Tipo: ' + sn.type : '', sn.address ? 'Indirizzo: ' + sn.address : '', sn.phone ? 'Telefono: ' + sn.phone : '', sn.instagram ? 'Instagram: ' + sn.instagram : '', sn.booking_link ? 'Link prenotazione (QR): ' + sn.booking_link : '', 'Orari:\n' + hoursText(sn.hours)].filter(Boolean).join('\n');
  }

  function card(o){
    var c = el('article', 'req ' + o.status);
    var top = el('div', 'req-top');
    top.appendChild(el('span', 'kind order', 'Ordine ' + o.code));
    top.appendChild(el('span', 'st ' + o.status, STATUS[o.status] || o.status));
    var when = el('span', 'when', ago(o.created_at)); when.title = dateFull(o.created_at); top.appendChild(when);
    c.appendChild(top);

    var b = el('div', 'req-biz');
    b.appendChild(el('div', 'avatar', (o.business_name || '?').trim().charAt(0).toUpperCase()));
    var bt = el('div'); var nm = el('b');
    if (o.business_id) { var a = el('a', null, o.business_name || 'Attivit\u00e0'); a.href = '/admin/attivita.html?id=' + encodeURIComponent(o.business_id); nm.appendChild(a); } else nm.textContent = o.business_name || 'Attivit\u00e0 eliminata';
    bt.appendChild(nm); b.appendChild(bt); c.appendChild(b);

    var body = el('div', 'req-body');
    var ul = el('ul', 'ord-items');
    (o.items || []).forEach(function(it){
      var li = el('li'); var l = el('span', null, it.qty + ' \u00d7 ' + it.name); l.appendChild(el('span', 'opt', itemLabel(it)));
      li.appendChild(l); li.appendChild(el('span', null, eur(it.line_eur))); ul.appendChild(li);
    });
    body.appendChild(ul);
    var tot = el('div', 'ord-tot'); tot.appendChild(el('span', null, 'Totale')); tot.appendChild(el('span', null, eur(o.total))); body.appendChild(tot);

    var sh = o.shipping || {};
    var box = el('div', 'ord-ship'); box.appendChild(el('b', null, 'Spedizione'));
    box.appendChild(document.createTextNode(shipText(sh).split('\n').join(' \u00b7 ')));
    if (sh.note) box.appendChild(el('div', 'note', 'Note: ' + sh.note));
    body.appendChild(box);

    var det = el('details', 'ord-print'); det.appendChild(el('summary', null, 'Dati da stampare'));
    var sn = o.snapshot || {}, dl = el('dl');
    [['Attivit\u00e0', sn.name], ['Tipo', sn.type], ['Indirizzo', sn.address], ['Telefono', sn.phone], ['Instagram', sn.instagram], ['Link del QR', sn.booking_link], ['Orari', hoursText(sn.hours)]].forEach(function(r){
      if (!r[1]) return; dl.appendChild(el('dt', null, r[0])); var dd = el('dd', null, r[1]); if (r[0] === 'Orari') dd.style.whiteSpace = 'pre-line'; dl.appendChild(dd);
    });
    det.appendChild(dl);
    var cr0 = el('div', 'copyrow'); var cb = el('button', 'btn small ghost', 'Copia i dati'); cb.type = 'button'; cb.onclick = function(){ copy(printText(o), cb, 'Copia i dati'); }; cr0.appendChild(cb); det.appendChild(cr0);
    body.appendChild(det);
    c.appendChild(body);

    var cr = el('div', 'req-contact'); var num = digits(sh.phone);
    cr.appendChild(el('div', 'who-c', sh.phone || 'Nessun telefono'));
    if (num) {
      var wa = el('a', 'btn small wa', 'WhatsApp'); wa.href = 'https://wa.me/' + num; wa.target = '_blank'; wa.rel = 'noopener'; cr.appendChild(wa);
      var tel = el('a', 'btn small ghost', 'Chiama'); tel.href = 'tel:+' + num; cr.appendChild(tel);
    }
    var ca = el('button', 'btn small ghost', 'Copia indirizzo'); ca.type = 'button'; ca.onclick = function(){ copy(shipText(sh), ca, 'Copia indirizzo'); }; cr.appendChild(ca);
    c.appendChild(cr);

    var act = el('div', 'req-act');
    function st(label, status, cls){ var x = el('button', 'btn small ' + (cls || ''), label); x.type = 'button'; x.disabled = !state.owner; x.onclick = function(){ setStatus(o, status, x); }; act.appendChild(x); }
    if (o.status === 'new') { st('Segna come pagato', 'paid'); st('Annulla ordine', 'cancelled', 'ghost'); }
    else if (o.status === 'paid') { st('Segna come spedito', 'shipped'); st('Rimetti da incassare', 'new', 'ghost'); }
    else if (o.status === 'shipped') st('Riapri', 'paid', 'ghost');
    else st('Riapri', 'new', 'ghost');
    c.appendChild(act);
    return c;
  }

  function setStatus(o, status, btn){
    if (!state.owner) return;
    btn.disabled = true;
    api('/api/admin/clients', { method: 'POST', body: JSON.stringify({ action: 'order_status', id: o.id, status: status }) })
      .then(function(){
        var was = o.status; o.status = status;
        state.counts[was] = Math.max(0, (state.counts[was] || 0) - 1); state.counts[status] = (state.counts[status] || 0) + 1;
        render(); if (window.liaNavBadgeOrders) window.liaNavBadgeOrders(state.counts.new);
      })
      .catch(function(e){ btn.disabled = false; banner('Non sono riuscito ad aggiornare l\u2019ordine: ' + e.message); });
  }

  function kpis(){
    var box = document.getElementById('kpis'); box.innerHTML = '';
    [['Da incassare', state.counts.new, 'nuovi ordini', state.counts.new ? 'warn' : ''], ['Da spedire', state.counts.paid, 'gi\u00e0 pagati', state.counts.paid ? 'warn' : ''], ['Spediti', state.counts.shipped, 'consegnati al corriere', '']].forEach(function(k){
      var d = el('div', 'kpi'); d.appendChild(el('div', 'lbl', k[0])); d.appendChild(el('div', 'val ' + k[3], String(k[1]))); d.appendChild(el('div', 'sub', k[2])); box.appendChild(d);
    });
  }

  function render(){
    kpis();
    var q = document.getElementById('search').value.trim().toLowerCase();
    var fs = document.getElementById('filterStatus').value;
    var rows = state.all.filter(function(o){
      if (fs === 'open' && !(o.status === 'new' || o.status === 'paid')) return false;
      if (fs !== 'open' && fs !== 'all' && o.status !== fs) return false;
      if (q) { var hay = [o.business_name || '', o.code, (o.shipping && o.shipping.name) || ''].join(' ').toLowerCase(); if (hay.indexOf(q) === -1) return false; }
      return true;
    });
    var box = document.getElementById('reqs'); box.innerHTML = '';
    if (!rows.length) {
      var e = el('div', 'req-empty'); e.appendChild(el('b', null, state.loaded ? (state.all.length ? 'Nessun ordine con questi filtri' : 'Nessun ordine, per ora') : 'Carico gli ordini\u2026'));
      if (state.loaded) e.appendChild(el('span', null, state.all.length ? 'Cambia filtro o cerca altro.' : 'Quando un cliente ordina dallo Shop, lo trovi qui.'));
      box.appendChild(e); return;
    }
    rows.forEach(function(o){ box.appendChild(card(o)); });
  }

  function load(){
    var btn = document.getElementById('reload'); btn.disabled = true;
    return api('/api/admin/clients?view=orders&status=all')
      .then(function(j){
        state.loaded = true; state.all = j.orders || []; state.counts = j.counts || state.counts;
        document.getElementById('setup').hidden = !j.setup_needed;
        render(); if (window.liaNavBadgeOrders) window.liaNavBadgeOrders(state.counts.new);
      })
      .catch(function(e){ state.loaded = true; render(); banner('Non riesco a caricare gli ordini: ' + e.message); })
      .then(function(){ btn.disabled = false; });
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filterStatus').addEventListener('change', render);
  document.getElementById('reload').addEventListener('click', load);
  render();
  api('/api/admin/clients?view=me').then(function(me){ state.owner = !!(me && me.role === 'owner'); if (!state.owner) banner('Con questo account puoi leggere gli ordini ma non cambiarne lo stato.'); render(); }).catch(function(){});
  load();
  setInterval(function(){ if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
