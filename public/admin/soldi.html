<!doctype html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prenolia Admin – Soldi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--logo:url("/brand/prenolia-dark.png");
  --bg:#050608; --bg2:#0A0D12; --card:#0E131B; --card2:#161D29; --line:#1C2532; --line2:#2A3648;
  --ink:#F9F6F0; --muted:#9BA6B5;
  --accent:#2DD2DC; --on-accent:#031016; --accent-soft:#0B2C33; --accent-ink:#A5EDF2;
  --green:#3FE08A; --green-soft:#0F2E20; --amber:#F5C15E; --amber-soft:#3A2E10; --red:#FF8A8A; --red-soft:#3A1616;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{--logo:url("/brand/prenolia-dark.png");}
html{background:var(--bg);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,p{margin:0;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px;}
.logo{display:block;width:120px;height:30px;background:var(--logo) center / contain no-repeat;}

.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
.top-row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;}
.spacer{flex:1;}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 100px;}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
@media (min-width:820px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);}
.kpi .lbl{font-size:.85rem;color:var(--muted);font-weight:500;}
.kpi .val{margin-top:8px;font-size:1.9rem;font-weight:700;letter-spacing:-0.03em;}
.kpi .val.warn{color:var(--amber);}
.kpi .val.bad{color:var(--red);}
.kpi .sub{margin-top:4px;font-size:.8rem;color:var(--muted);}

.toolbar{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.search{flex:1;min-width:200px;position:relative;}
.search input{width:100%;min-height:46px;padding:0 16px 0 40px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.98rem;}
.search input:focus{outline:none;border-color:var(--accent);}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.filter{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.94rem;}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:.96rem;font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.08);}

.tablewrap{margin-top:18px;border-radius:22px;border:1px solid var(--line);background:var(--card);overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:1240px;}
th{text-align:left;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.who{display:flex;align-items:center;gap:12px;}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;}
.who b{display:block;font-size:.98rem;font-weight:600;white-space:nowrap;}
.who span{display:block;font-size:.8rem;color:var(--muted);}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;}
.pill.active{background:var(--green-soft);color:var(--green);}
.pill.trial{background:var(--accent-soft);color:var(--accent-ink);}
.pill.warn{background:var(--amber-soft);color:var(--amber);}
.pill.bad{background:var(--red-soft);color:var(--red);}
.plan-name{font-size:.9rem;color:var(--muted);margin-top:3px;}
.renew{font-weight:600;font-size:.94rem;}
.renew.warn{color:var(--amber);} .renew.bad{color:var(--red);}
.renew small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:1px;}
.mrr{font-weight:700;font-variant-numeric:tabular-nums;}
.appts{font-variant-numeric:tabular-nums;}
.contact a{display:block;color:var(--muted);font-size:.86rem;text-decoration:none;}
.contact a:hover{color:var(--accent-ink);}
.empty-row td{text-align:center;color:var(--muted);padding:40px 20px;}

/* pannello "nuovo cliente" */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card2);border-radius:26px 26px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.sheet.on{transform:translateY(0);}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 18px;}
.sheet h2{font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;}
.field{margin-top:16px;display:grid;gap:7px;}
.field label{font-size:.88rem;font-weight:500;color:var(--muted);}
.inp,select.inp{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sheet-actions{margin-top:22px;display:flex;gap:10px;}
.sheet-actions .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2);}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{transition:none;}}
nav{display:flex;gap:4px;}
nav a{padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;}
nav a.on{background:var(--card2);color:var(--ink);}
.pill.na{background:var(--card2);color:var(--muted);}
.health-reasons{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;max-width:240px;white-space:normal;line-height:1.35;}
.health-up{margin-top:6px;}
.svc-sub{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;white-space:normal;max-width:190px;line-height:1.35;}
.btn.small{min-height:36px;padding:0 14px;font-size:.86rem;border-radius:11px;}
.btn.danger{background:transparent;color:#FF8A8A;box-shadow:inset 0 0 0 1.5px #5A2A2A;}
.act-btn{justify-content:center;width:100%;}

.pagehd h1{font-size:1.6rem;letter-spacing:-0.02em;margin:0;}
.pagehd p{color:var(--muted);margin:6px 0 0;font-size:.95rem;line-height:1.45;}
.grid2{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr;}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr;}}
.card{border-radius:22px;border:1px solid var(--line);background:var(--card);padding:20px;}
.card.wide{grid-column:1/-1;}
.card h2{font-size:1.02rem;margin:0 0 4px;letter-spacing:-0.01em;}
.card .hint{color:var(--muted);font-size:.84rem;margin:0 0 14px;line-height:1.4;}
.bars{display:grid;gap:9px;}
.barrow{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:10px;font-size:.9rem;}
.barrow .track{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;}
.barrow .fill{height:100%;border-radius:99px;background:var(--accent);}
.barrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}
.stack{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px;}
.stack .col{flex:1;display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start;}
.stack .col i{display:block;width:100%;}
.stack .c-web{background:#2DD2DC;} .stack .c-telegram{background:#0AA2EE;} .stack .c-whatsapp{background:#3FE08A;}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:var(--muted);}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.74rem;margin-top:6px;}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:.7rem;color:var(--muted);align-items:center;}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--accent);}
.heat .h{text-align:center;}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;}
.tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl tr:last-child td{border-bottom:0;}
.tbl a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line2);}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tw{overflow-x:auto;}
.up{color:#3FE08A;} .down{color:#FF8A8A;}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0;}
.loading{color:var(--muted);padding:40px 0;text-align:center;}

.diverge{display:flex;gap:4px;height:190px;margin-top:8px;}
.dcol{flex:1;display:flex;flex-direction:column;height:100%;}
.dcol .up{height:50%;display:flex;flex-direction:column-reverse;border-bottom:1px solid var(--line2);}
.dcol .dn{height:50%;display:flex;flex-direction:column;}
.dcol i{display:block;width:100%;min-height:0;}
.s-new{background:#3FE08A;} .s-exp{background:#2DD2DC;} .s-rea{background:#0AA2EE;} .s-chu{background:#FF6B6B;} .s-con{background:#F5A45E;}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
@media (max-width:640px){.mini{grid-template-columns:1fr;}}
.mini div{background:var(--card2);border-radius:14px;padding:12px 14px;}
.mini b{display:block;font-size:1.2rem;letter-spacing:-0.01em;}
.mini span{color:var(--muted);font-size:.8rem;}
.dayh{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;margin:14px 0 2px;}
.pill.soft{background:var(--card2);color:var(--muted);}
</style>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><span class="logo" role="img" aria-label="Prenolia"></span></div>
    <nav id="mainNav">
      <a href="/admin/clienti.html">I tuoi clienti</a>
      <a href="/admin/">Andamento</a>
      <a href="/admin/lia.html">Uso di Lia</a>
      <a href="/admin/soldi.html">Soldi</a>
      <a href="/admin/costi.html">Costi</a>
    </nav>
    <div class="spacer"></div>
  </div>
</header>
<script src="/admin/auth.js"></script>
<script src="/admin/nav.js"></script>

<div class="wrap">
  <div class="pagehd"><h1>Soldi</h1><p>Incasso mensile, rinnovi in arrivo e quanto è a rischio. Gli importi sono al mese, IVA esclusa.</p></div>
  <div id="root"><div class="loading">Carico i dati…</div></div>
</div>

<script>


(function(){
  var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var PIANO = { base:'Base', ai:'Base + Lia' };
  var eur = new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', minimumFractionDigits:0, maximumFractionDigits:2 });
  var root = document.getElementById('root');

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function d1(iso){ var d = new Date(iso); return d.getDate() + ' ' + MESI[d.getMonth()]; }
  function card(title, hint, wide){ var c = el('div', 'card' + (wide ? ' wide' : '')); c.appendChild(el('h2', null, title)); if (hint) c.appendChild(el('p','hint',hint)); return c; }
  function kpi(label, val, sub){ var k = el('div','kpi'); k.appendChild(el('div','lbl',label)); k.appendChild(el('div','val',val)); k.appendChild(el('div','sub',sub||'')); return k; }
  function num(v){ return String(v).replace('.', ','); }   // all'italiana: 4,5 e non 4.5
  function pctTxt(v){ return v == null ? '—' : num(v) + '%'; }
  function signed(v){ return v == null ? 'nessun confronto' : (v > 0 ? '+' : '') + num(v) + '% sul mese scorso'; }
  function link(text, id){ var a = el('a', null, text); a.href = '/admin/attivita.html?id=' + encodeURIComponent(id); a.style.cssText = 'color:inherit;text-decoration:none;border-bottom:1px dashed var(--line2);'; return a; }

  function euroBars(map){
    var box = el('div','bars'); var keys = Object.keys(map).filter(function(k){ return map[k] > 0; }).sort(function(a,b){ return map[b]-map[a]; });
    if (!keys.length){ box.appendChild(el('div','empty','Nessun incasso.')); return box; }
    var max = map[keys[0]] || 1;
    keys.forEach(function(k){
      var r = el('div','barrow'); r.appendChild(el('span',null,k));
      var t = el('div','track'); var f = el('div','fill'); f.style.width = Math.round(map[k]/max*100) + '%'; t.appendChild(f); r.appendChild(t);
      var n = el('span','n',eur.format(map[k])); n.style.width = '78px'; r.appendChild(n); r.style.gridTemplateColumns = '130px 1fr 78px'; box.appendChild(r);
    });
    return box;
  }

  function table(cols, rows){
    var wrap = el('div','tw'); var t = el('table','tbl'); var thead = el('thead'); var hr = el('tr');
    cols.forEach(function(c){ hr.appendChild(el('th', c.num ? 'num' : '', c.label)); }); thead.appendChild(hr); t.appendChild(thead);
    var tb = el('tbody'); rows.forEach(function(r){ var tr = el('tr'); cols.forEach(function(c){ var td = el('td', c.num ? 'num' : ''); c.render(td, r); tr.appendChild(td); }); tb.appendChild(tr); });
    t.appendChild(tb); wrap.appendChild(t); return wrap;
  }
  function money(v){ return function(td, r){ var x = r[v]; td.textContent = x ? eur.format(x) : '—'; }; }

  function render(d){
    root.innerHTML = '';
    var k = d.kpis, rn = d.renewals, ar = d.at_risk;

    if (d.warnings && d.warnings.length){ var w = el('div', null, 'Attenzione: ' + d.warnings.join('; ') + '.'); w.style.cssText = 'background:#3A2E12;color:#F5C15E;padding:10px 14px;border-radius:12px;margin:14px 0 0;font-size:.9rem;'; root.appendChild(w); }

    var k1 = el('div','kpis'); k1.style.marginTop = '16px';
    k1.appendChild(kpi('Incasso mensile (MRR)', eur.format(k.mrr), signed(k.growth_pct)));
    k1.appendChild(kpi('Incasso annuo (ARR)', eur.format(k.arr), k.paying + ' clienti che pagano · ' + eur.format(k.arpa) + ' a cliente'));
    k1.appendChild(kpi('Incasso a rischio', eur.format(ar.total.amount), ar.total.count + ' clienti da seguire'));
    k1.appendChild(kpi('Già persi', eur.format(ar.suspended.amount), ar.suspended.count + ' sospesi per mancato pagamento'));
    root.appendChild(k1);
    var k2 = el('div','kpis'); k2.style.marginTop = '12px';
    k2.appendChild(kpi('Clienti persi', pctTxt(k.churn_logo_pct), k.prev_month_label ? 'in ' + k.prev_month_label + ' · ' + pctTxt(k.churn_rev_pct) + ' dell\'incasso' : 'nessun confronto'));
    k2.appendChild(kpi('Tenuta dell\'incasso', pctTxt(k.nrr_pct), 'quanto incasso resta da un mese all\'altro'));
    k2.appendChild(kpi('Valore di un cliente', k.ltv_estimate ? eur.format(k.ltv_estimate) : '—', k.ltv_estimate ? 'stima: incasso medio ÷ tasso di perdita' : 'servono più mesi di dati'));
    k2.appendChild(kpi('Incasso da Base + Lia', k.ai_share_pct + '%', eur.format(k.mrr_ai) + ' al mese'));
    root.appendChild(k2);

    var g = el('div','grid2'); root.appendChild(g);

    // ---- movimento
    var mv = card('Movimento dell\'incasso', 'Cosa è cambiato mese per mese: sopra ciò che entra, sotto ciò che esce.', true);
    var maxv = 0; d.movement.forEach(function(r){ maxv = Math.max(maxv, r.new + r.expansion + r.reactivation, r.churn + r.contraction); });
    maxv = maxv || 1;
    var dv = el('div','diverge');
    d.movement.forEach(function(r){
      var col = el('div','dcol'); col.title = r.m + ': +' + eur.format(r.new + r.expansion + r.reactivation) + ' / -' + eur.format(r.churn + r.contraction) + ' → ' + eur.format(r.end);
      var up = el('div','up'), dn = el('div','dn');
      [['new','s-new'],['expansion','s-exp'],['reactivation','s-rea']].forEach(function(p){ if (r[p[0]]){ var i = el('i',p[1]); i.style.height = (r[p[0]]/maxv*100) + '%'; up.appendChild(i); } });
      [['churn','s-chu'],['contraction','s-con']].forEach(function(p){ if (r[p[0]]){ var i = el('i',p[1]); i.style.height = (r[p[0]]/maxv*100) + '%'; dn.appendChild(i); } });
      col.appendChild(up); col.appendChild(dn); dv.appendChild(col);
    });
    mv.appendChild(dv);
    var ax = el('div','axis'); ax.appendChild(el('span',null,d.movement[0].m)); ax.appendChild(el('span',null,d.movement[d.movement.length-1].m)); mv.appendChild(ax);
    var lg = el('div','legend');
    [['Nuovi','#3FE08A'],['Upgrade','#2DD2DC'],['Riattivati','#0AA2EE'],['Persi','#FF6B6B'],['Downgrade','#F5A45E']].forEach(function(p){ var s = el('span'); var b = el('b'); b.style.background = p[1]; s.appendChild(b); s.appendChild(document.createTextNode(p[0])); lg.appendChild(s); });
    mv.appendChild(lg);
    var rows6 = d.movement.slice(-6).reverse();
    var tw = table([
      { label:'Mese', render:function(td,r){ td.textContent = r.m; } },
      { label:'Inizio', num:true, render:money('start') },
      { label:'Nuovi', num:true, render:money('new') },
      { label:'Upgrade', num:true, render:money('expansion') },
      { label:'Riattivati', num:true, render:money('reactivation') },
      { label:'Downgrade', num:true, render:money('contraction') },
      { label:'Persi', num:true, render:money('churn') },
      { label:'Fine', num:true, render:function(td,r){ td.textContent = eur.format(r.end); td.style.fontWeight = '600'; } }
    ], rows6); tw.style.marginTop = '16px'; mv.appendChild(tw);
    var note = el('p','hint','Prima dei pulsanti "Cambia piano", "Annulla" e "Riattiva" i cambi di piano non venivano registrati: da ora sono tutti tracciati con il prezzo.'); note.style.marginTop = '12px'; mv.appendChild(note);
    g.appendChild(mv);

    // ---- rinnovi
    var rc = card('Rinnovi', 'Cosa incasserai nei prossimi giorni e cosa c\'è da recuperare.', true);
    var mini = el('div','mini');
    [['Prossimi 7 giorni', rn.next7.amount, rn.next7.count + ' rinnovi'], ['Prossimi 30 giorni', rn.next30.amount, rn.next30.count + ' rinnovi'], ['Prove da convertire (14 giorni)', rn.trials14.amount, rn.trials14.count + ' prove · incasso possibile']].forEach(function(p){
      var b = el('div'); b.appendChild(el('span',null,p[0])); b.appendChild(el('b',null,eur.format(p[1]))); b.appendChild(el('span',null,p[2])); mini.appendChild(b);
    });
    rc.appendChild(mini);
    if (rn.overdue.length){
      var oh = el('div','dayh'); oh.appendChild(el('span',null,'Da recuperare adesso')); oh.appendChild(el('span',null,eur.format(rn.overdue.reduce(function(s,i){ return s + i.amount; },0)))); rc.appendChild(oh);
      var ol = el('div','list'); rn.overdue.forEach(function(i){ var li = el('div','li'); var l = el('div'); l.appendChild(link(i.name, i.id)); l.appendChild(el('small',null,'scaduto il ' + d1(i.date) + ' · ' + (PIANO[i.plan] || '') + ' · ' + (i.state === 'suspended' ? 'sospeso' : 'in tolleranza'))); li.appendChild(l); li.appendChild(el('div','r',eur.format(i.amount))); ol.appendChild(li); }); rc.appendChild(ol);
    }
    var byDay = {}; rn.upcoming.forEach(function(i){ var k2 = String(i.date).slice(0,10); (byDay[k2] = byDay[k2] || []).push(i); });
    var days = Object.keys(byDay).sort();
    if (!days.length){ var e = el('div','empty','Nessun rinnovo nei prossimi 45 giorni.'); rc.appendChild(e); }
    days.forEach(function(day){
      var items = byDay[day]; var hh = el('div','dayh'); hh.appendChild(el('span',null,d1(day + 'T12:00:00'))); hh.appendChild(el('span',null,eur.format(items.reduce(function(s,i){ return s + i.amount; },0)))); rc.appendChild(hh);
      var ul = el('div','list'); items.forEach(function(i){ var li = el('div','li'); var l = el('div'); l.appendChild(link(i.name, i.id)); l.appendChild(el('small',null,(i.kind === 'conversione' ? 'fine prova: se passa a pagamento · ' : 'rinnovo · ') + (PIANO[i.plan] || ''))); li.appendChild(l); li.appendChild(el('div','r',eur.format(i.amount))); ul.appendChild(li); }); rc.appendChild(ul);
    });
    g.appendChild(rc);

    // ---- a rischio
    var rk = card('Incasso a rischio', 'Clienti che pagano ma potrebbero smettere: abbonamento scaduto in tolleranza, oppure nessuna attività.');
    var rl = el('div','list');
    if (!ar.list.length) rl.appendChild(el('div','empty','Nessuno: tutti i clienti che pagano sono in salute.'));
    ar.list.forEach(function(x){ var li = el('div','li'); var l = el('div'); l.appendChild(link(x.name, x.id)); l.appendChild(el('small',null,x.reasons.join(' · '))); li.appendChild(l); li.appendChild(el('div','r',eur.format(x.amount))); rl.appendChild(li); });
    rk.appendChild(rl); g.appendChild(rk);

    var by = card('Incasso per settore'); by.appendChild(euroBars(d.by_type)); g.appendChild(by);
    var bp = card('Incasso per piano'); var pm = {}; pm['Base'] = k.mrr_base; pm['Base + Lia'] = k.mrr_ai; bp.appendChild(euroBars(pm)); g.appendChild(bp);
  }

  window.liaApi('/api/admin/clients?view=money').then(render).catch(function(e){ root.innerHTML = ''; window.liaBanner('Non riesco a caricare i dati: ' + e.message); });
})();
</script>
</body>
</html>
