html{background:var(--bg);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,p{margin:0;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px;}
.logo{display:block;width:47px;height:34px;background:var(--logo) center / contain no-repeat;}

.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
.top-row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;}
.spacer{flex:1;}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 100px;}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
@media (min-width:820px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);}
.kpi .lbl{font-size:.85rem;color:var(--muted);font-weight:500;}
.kpi .val{margin-top:8px;font-size:1.9rem;font-weight:700;letter-spacing:-0.03em;}
.kpi .val.warn{color:var(--amber);}
.kpi .val.bad{color:var(--red);}
.kpi .sub{margin-top:4px;font-size:.8rem;color:var(--muted);}

.toolbar{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.search{flex:1;min-width:200px;position:relative;}
.search input{width:100%;min-height:46px;padding:0 16px 0 40px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.98rem;}
.search input:focus{outline:none;border-color:var(--accent);}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.filter{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.94rem;}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:.96rem;font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.08);}

.tablewrap{margin-top:18px;border-radius:22px;border:1px solid var(--line);background:var(--card);overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:1240px;}
th{text-align:left;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.who{display:flex;align-items:center;gap:12px;}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;}
.who b{display:block;font-size:.98rem;font-weight:600;white-space:nowrap;}
.who span{display:block;font-size:.8rem;color:var(--muted);}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;}
.pill.active{background:var(--green-soft);color:var(--green);}
.pill.trial{background:var(--accent-soft);color:var(--accent-ink);}
.pill.warn{background:var(--amber-soft);color:var(--amber);}
.pill.bad{background:var(--red-soft);color:var(--red);}
.plan-name{font-size:.9rem;color:var(--muted);margin-top:3px;}
.renew{font-weight:600;font-size:.94rem;}
.renew.warn{color:var(--amber);} .renew.bad{color:var(--red);}
.renew small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:1px;}
.mrr{font-weight:700;font-variant-numeric:tabular-nums;}
.appts{font-variant-numeric:tabular-nums;}
.contact a{display:block;color:var(--muted);font-size:.86rem;text-decoration:none;}
.contact a:hover{color:var(--accent-ink);}
.empty-row td{text-align:center;color:var(--muted);padding:40px 20px;}

/* pannello "nuovo cliente" */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card2);border-radius:26px 26px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.sheet.on{transform:translateY(0);}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 18px;}
.sheet h2{font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;}
.field{margin-top:16px;display:grid;gap:7px;}
.field label{font-size:.88rem;font-weight:500;color:var(--muted);}
.inp,select.inp{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sheet-actions{margin-top:22px;display:flex;gap:10px;}
.sheet-actions .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2);}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{transition:none;}}
nav{display:flex;gap:4px;}
nav a{padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;}
nav a.on{background:var(--card2);color:var(--ink);}
.pill.na{background:var(--card2);color:var(--muted);}
.health-reasons{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;max-width:240px;white-space:normal;line-height:1.35;}
.health-up{margin-top:6px;}
.svc-sub{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;white-space:normal;max-width:190px;line-height:1.35;}
.btn.small{min-height:36px;padding:0 14px;font-size:.86rem;border-radius:11px;}
.btn.danger{background:transparent;color:#FF8A8A;box-shadow:inset 0 0 0 1.5px #5A2A2A;}
.act-btn{justify-content:center;width:100%;}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;margin:4px 0 14px;}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.hd h1{font-size:1.6rem;letter-spacing:-0.02em;margin:0;}
.hd .sub{color:var(--muted);font-size:.95rem;width:100%;margin-top:-4px;}
.grid2{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr;}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr;}}
.card{border-radius:22px;border:1px solid var(--line);background:var(--card);padding:20px;}
.card h2{font-size:1.02rem;margin:0 0 4px;letter-spacing:-0.01em;}
.card .hint{color:var(--muted);font-size:.84rem;margin:0 0 14px;line-height:1.4;}
.bars{display:grid;gap:9px;}
.barrow{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:10px;font-size:.9rem;}
.barrow .track{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;}
.barrow .fill{height:100%;border-radius:99px;background:var(--accent);}
.barrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}
.days{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:6px;}
.days i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.9;}
.days i.z{background:var(--card2);}
.dayaxis{display:flex;justify-content:space-between;color:var(--muted);font-size:.74rem;margin-top:6px;}
.list{display:grid;gap:0;}
.li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:.92rem;}
.li:first-child{border-top:0;}
.li small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px;}
.li .r{text-align:right;color:var(--muted);white-space:nowrap;}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.94rem;}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;}
.dot.ok{background:#0F3B26;color:#3FE08A;}
.dot.no{background:#3A1C1C;color:#FF8A8A;}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0;}
.conv{cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%;}
.msgs{max-height:58vh;overflow-y:auto;display:grid;gap:8px;margin-top:14px;padding-right:4px;}
.bub{max-width:86%;padding:9px 13px;border-radius:16px;font-size:.94rem;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;}
.bub.user{background:var(--card);border:1px solid var(--line);justify-self:start;border-bottom-left-radius:5px;}
.bub.assistant{background:var(--accent-soft,#0B2C33);color:var(--ink);justify-self:end;border-bottom-right-radius:5px;}
.bub small{display:block;color:var(--muted);font-size:.72rem;margin-top:4px;}
.loading{color:var(--muted);padding:40px 0;text-align:center;}
</style>
</head>

</div>

<script>
window.liaApi = function(path, opts, retry){
  var key = retry ? null : localStorage.getItem('lia_admin_key');
  if (!key) {
    key = window.prompt('Chiave admin Lia');
    if (!key) return Promise.reject(new Error('Chiave admin mancante'));
    localStorage.setItem('lia_admin_key', key);
  }
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, { 'x-admin-key': key, 'Content-Type': 'application/json' });
  return fetch(path, opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (r.status === 401) {
        localStorage.removeItem('lia_admin_key');
        if (!retry) return window.liaApi(path, opts, true);
        throw new Error('Chiave non valida');
      }
      if (!r.ok) throw new Error((j.error || r.status) + (j.detail ? ' – ' + j.detail : ''));
      return j;
    });
  });
};
window.liaBanner = function(msg){
  var el = document.getElementById('liaBanner');
  if (!el) {
    el = document.createElement('div'); el.id = 'liaBanner';
    el.style.cssText = 'background:#3a1c1c;color:#ffb4b4;padding:12px 16px;border-radius:12px;margin:0 0 14px;font-size:.92rem;line-height:1.45;';
    var wrap = document.querySelector('.wrap'); wrap.insertBefore(el, wrap.firstChild);
  }
  el.textContent = msg;
};


(function(){
  var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var GIORNI = { 1:'Lun', 2:'Mar', 3:'Mer', 4:'Gio', 5:'Ven', 6:'Sab', 7:'Dom' };
  var CANALI = { whatsapp:'WhatsApp', telegram:'Telegram', web:'Chat sul sito', selfservice:'Prenotazione online', manuale:'Inserita a mano', altro:'Altro' };
  var LIA = ['whatsapp','telegram','web'];
  var eur = new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', minimumFractionDigits:0, maximumFractionDigits:2 });
  var root = document.getElementById('root');

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function d1(iso){ var d = new Date(iso); return d.getDate() + ' ' + MESI[d.getMonth()]; }
  function dt(iso){ var d = new Date(iso); return d.getDate() + ' ' + MESI[d.getMonth()] + ' · ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
  function card(title, hint){ var c = el('div','card'); c.appendChild(el('h2', null, title)); if (hint) c.appendChild(el('p','hint',hint)); return c; }
  function pill(text, cls){ return el('span', 'pill ' + cls, text); }

  function kpi(label, val, sub, cls){
    var k = el('div','kpi'); k.appendChild(el('div','lbl',label));
    var v = el('div','val',val); if (cls) v.classList.add(cls); k.appendChild(v);
    k.appendChild(el('div','sub',sub||'')); return k;
  }

  function bars(map, labels, total){
    var box = el('div','bars'); var keys = Object.keys(map).sort(function(a,b){ return map[b]-map[a]; });
    if (!keys.length){ box.appendChild(el('div','empty','Nessun dato negli ultimi 30 giorni.')); return box; }
    var max = Math.max.apply(null, keys.map(function(k){ return map[k]; })) || 1;
    keys.forEach(function(k){
      var r = el('div','barrow'); r.appendChild(el('span',null,labels[k] || k));
      var t = el('div','track'); var f = el('div','fill'); f.style.width = Math.round(map[k]/max*100) + '%'; t.appendChild(f); r.appendChild(t);
      r.appendChild(el('span','n',String(map[k]))); box.appendChild(r);
    });
    return box;
  }

  function apptList(list){
    var box = el('div','list');
    if (!list.length){ box.appendChild(el('div','empty','Nessuno.')); return box; }
    list.forEach(function(a){
      var li = el('div','li'); var l = el('div'); l.appendChild(document.createTextNode(a.service + ' · ' + a.customer));
      l.appendChild(el('small', null, dt(a.at) + ' · ' + (CANALI[a.channel] || a.channel) + (a.status === 'cancelled' ? ' · annullato' : '')));
      li.appendChild(l); li.appendChild(el('div','r', a.price ? eur.format(a.price) : '')); box.appendChild(li);
    });
    return box;
  }

  function hoursText(hours){
    if (!hours.length) return null;
    var groups = {}; hours.forEach(function(h){ var key = h.ranges.join(', '); (groups[key] = groups[key] || []).push(h.weekday); });
    return Object.keys(groups).map(function(k){
      var days = groups[k]; var txt = days.length > 1 && days[days.length-1]-days[0] === days.length-1 ? GIORNI[days[0]] + '–' + GIORNI[days[days.length-1]] : days.map(function(x){ return GIORNI[x]; }).join(', ');
      return txt + ': ' + k;
    });
  }

  var ACTIONS = { mark_paid:'Segnato come pagato', extend:'Proroga concessa', suspend:'Servizio sospeso', reactivate:'Servizio riattivato', cancel:'Abbonamento annullato', assign_plan:'Piano assegnato', view_conversation:'Letta una conversazione' };

  function render(d){
    root.innerHTML = '';
    var b = d.business, s = d.subscription, sv = d.service, a = d.appointments30, l = d.lia30;
    document.title = b.name + ' · Lia Admin';

    var hd = el('div','hd'); hd.appendChild(el('h1', null, b.name));
    if (s) hd.appendChild(pill(s.plan === 'Base+Lia' ? 'Base + Lia' : (s.plan || 'Base'), 'trial'));
    if (sv){
      var SV = { active:['Servizio attivo','active'], grace:['In tolleranza','warn'], suspended:['Sospeso','bad'], cancelled:['Annullato','na'], unmanaged:['Senza abbonamento','na'] };
      var m = SV[sv.state] || [sv.state,'na']; hd.appendChild(pill(m[0], m[1]));
    }
    var sub = b.type + ' · cliente dal ' + d1(b.created_at) + (b.phone ? ' · ' + b.phone : '');
    hd.appendChild(el('div','sub',sub)); root.appendChild(hd);

    if (d.warnings && d.warnings.length){ var w = el('div', null, 'Alcune sezioni non sono leggibili al momento: ' + d.warnings.join(', ') + '.'); w.style.cssText = 'background:#3A2E12;color:#F5C15E;padding:10px 14px;border-radius:12px;margin:14px 0 0;font-size:.9rem;'; root.appendChild(w); }

    // ---- KPI
    var k = el('div','kpis'); k.style.marginTop = '16px';
    var planTxt = s && s.price ? eur.format(s.price) + '/mese' : '—';
    var svcSub = sv && sv.paid_until ? (sv.state === 'suspended' ? 'scaduto il ' : 'pagato fino al ') + d1(sv.paid_until) : (sv && sv.state === 'unmanaged' ? 'nessun abbonamento registrato' : '');
    k.appendChild(kpi('Abbonamento', planTxt, s ? (s.plan === 'Base+Lia' ? 'Base + Lia' : 'Base') : 'nessun piano'));
    k.appendChild(kpi('Servizio', sv ? ({active:'Attivo',grace:'Tolleranza',suspended:'Sospeso',cancelled:'Annullato',unmanaged:'Non gestito'}[sv.state] || sv.state) : '—', svcSub, sv && sv.state === 'suspended' ? 'bad' : (sv && sv.state === 'grace' ? 'warn' : '')));
    k.appendChild(kpi('Appuntamenti (30 gg)', String(a.confirmed), a.cancelled + ' annullati (' + a.cancel_rate + '%)'));
    k.appendChild(kpi('Valore prenotato (30 gg)', eur.format(a.revenue), 'somma dei servizi confermati'));
    root.appendChild(k);

    // ---- griglia
    var g = el('div','grid2'); root.appendChild(g);

    var cl = card('Uso di Lia · ultimi 30 giorni', s && s.plan !== 'Base+Lia' && !l.messages_from_customers ? 'Il piano Base non comprende Lia.' : 'Messaggi ricevuti e prenotazioni fatte dall\'assistente.');
    var lk = el('div','kpis'); lk.style.cssText = 'grid-template-columns:repeat(2,1fr);margin-bottom:14px;';
    lk.appendChild(kpi('Messaggi dai clienti', String(l.messages_from_customers), l.messages_from_lia + ' risposte di Lia'));
    lk.appendChild(kpi('Clienti diversi', String(l.contacts), 'che hanno scritto'));
    lk.appendChild(kpi('Prenotate da Lia', String(l.bookings), 'WhatsApp, Telegram, sito'));
    lk.appendChild(kpi('Valore portato da Lia', eur.format(l.bookings_value), 'servizi prenotati in chat'));
    cl.appendChild(lk);
    var max = Math.max.apply(null, l.per_day.map(function(x){ return x.n; })) || 1;
    var days = el('div','days'); l.per_day.forEach(function(x){ var i = el('i', x.n ? '' : 'z'); i.style.height = (x.n ? Math.max(6, Math.round(x.n/max*100)) : 3) + '%'; i.title = d1(x.d) + ': ' + x.n; days.appendChild(i); });
    cl.appendChild(days);
    var ax = el('div','dayaxis'); ax.appendChild(el('span',null,d1(l.per_day[0].d))); ax.appendChild(el('span',null,'messaggi al giorno')); ax.appendChild(el('span',null,d1(l.per_day[l.per_day.length-1].d))); cl.appendChild(ax);
    g.appendChild(cl);

    var cc = card('Da dove arrivano le prenotazioni', 'Appuntamenti confermati negli ultimi 30 giorni, per canale.');
    cc.appendChild(bars(a.by_channel, CANALI)); g.appendChild(cc);

    var up = card('Prossimi appuntamenti'); up.appendChild(apptList(d.upcoming)); g.appendChild(up);
    var rc = card('Ultimi appuntamenti'); rc.appendChild(apptList(d.recent)); g.appendChild(rc);

    var sc = card('Servizi e orari');
    var sl = el('div','list');
    if (!d.services.length) sl.appendChild(el('div','empty','Nessun servizio attivo.'));
    d.services.forEach(function(x){ var li = el('div','li'); var lf = el('div'); lf.appendChild(document.createTextNode(x.name)); lf.appendChild(el('small',null,x.duration_min + ' min' + (x.at_customer_place ? ' · a domicilio' : ''))); li.appendChild(lf); li.appendChild(el('div','r',eur.format(x.price))); sl.appendChild(li); });
    sc.appendChild(sl);
    var ht = hoursText(d.hours); var hb = el('div','list'); hb.style.marginTop = '10px';
    if (!ht) hb.appendChild(el('div','empty','Orari di apertura non impostati.'));
    else ht.forEach(function(t){ hb.appendChild(el('div','li',t)); });
    sc.appendChild(hb); g.appendChild(sc);

    var st = card('Configurazione', 'Cosa ha già impostato il cliente.');
    [['services','Servizi inseriti'],['resource','Operatore attivo'],['hours','Orari di apertura'],['whatsapp','WhatsApp del titolare'],['telegram','Telegram collegato'],['recap','Riepilogo del mattino attivo']].forEach(function(p){
      var r = el('div','chk'); r.appendChild(el('span','dot ' + (d.setup[p[0]] ? 'ok' : 'no'), d.setup[p[0]] ? '✓' : '✕')); r.appendChild(el('span',null,p[1])); st.appendChild(r);
    });
    g.appendChild(st);

    var cv = card('Conversazioni · ultimi 30 giorni', 'I contatti sono nascosti. Aprire una conversazione è consentito ma viene registrato nello storico.');
    var cl2 = el('div','list');
    if (!d.conversations.length) cl2.appendChild(el('div','empty','Nessuna conversazione.'));
    d.conversations.forEach(function(x){
      var li = el('div','li'); var btn = el('button','conv'); btn.type = 'button';
      btn.appendChild(document.createTextNode((CANALI[x.channel] || x.channel) + ' · ' + x.label)); btn.appendChild(el('small',null, x.messages + ' messaggi · ultimo ' + dt(x.last)));
      btn.addEventListener('click', function(){ openConversation(b.id, x); });
      li.appendChild(btn); li.appendChild(el('div','r','Apri')); cl2.appendChild(li);
    });
    cv.appendChild(cl2); g.appendChild(cv);

    var tl = card('Storico delle azioni'); var tll = el('div','list');
    if (!d.timeline.length) tll.appendChild(el('div','empty','Ancora nessuna azione registrata.'));
    d.timeline.forEach(function(x){ var li = el('div','li'); li.appendChild(el('div',null,(ACTIONS[x.action] || x.action) + (x.details && x.details.months ? ' (+' + x.details.months + ' mese)' : '') + (x.details && x.details.days ? ' (+' + x.details.days + ' giorni)' : ''))); li.appendChild(el('div','r',dt(x.at))); tll.appendChild(li); });
    tl.appendChild(tll); g.appendChild(tl);
  }

  // ---- conversazione (apertura registrata lato server)
  var convBg = document.getElementById('convBg'), convSheet = document.getElementById('convSheet');
  function closeConv(){ convBg.classList.remove('on'); convSheet.classList.remove('on'); }
  document.getElementById('convClose').addEventListener('click', closeConv); convBg.addEventListener('click', closeConv);
  function openConversation(id, x){
    var box = document.getElementById('convMsgs'); box.innerHTML = ''; box.appendChild(el('div','loading','Apro la conversazione…'));
    document.getElementById('convTitle').textContent = (CANALI[x.channel] || x.channel) + ' · ' + x.label;
    convBg.classList.add('on'); convSheet.classList.add('on');
    window.liaApi('/api/admin/clients?view=conversation&id=' + encodeURIComponent(id) + '&contact=' + encodeURIComponent(x.ref)).then(function(res){
      box.innerHTML = '';
      if (!res.messages.length) box.appendChild(el('div','empty','Nessun messaggio.'));
      res.messages.forEach(function(m){ var bb = el('div','bub ' + (m.role === 'user' ? 'user' : 'assistant'), m.content); bb.appendChild(el('small',null,(m.role === 'user' ? 'Cliente' : 'Lia') + ' · ' + dt(m.at))); box.appendChild(bb); });
      box.scrollTop = box.scrollHeight;
    }).catch(function(e){ box.innerHTML = ''; box.appendChild(el('div','empty','Non riesco ad aprirla: ' + e.message)); });
  }

  // ---- avvio
  var id = new URLSearchParams(location.search).get('id') || '';
  if (!/^[0-9a-f-]{36}$/i.test(id)){ root.innerHTML = ''; window.liaBanner('Link non valido: manca l\'attività. Torna alla lista clienti.'); return; }
  window.liaApi('/api/admin/clients?view=detail&id=' + encodeURIComponent(id))
    .then(render)
    .catch(function(e){ root.innerHTML = ''; window.liaBanner('Non riesco a caricare la scheda: ' + e.message); });
})();
</script>
