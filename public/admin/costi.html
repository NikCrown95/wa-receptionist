<!doctype html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prenolia Admin – Costi e margine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--logo:url("/brand/prenolia-dark.png");
  --bg:#050608; --bg2:#0A0D12; --card:#0E131B; --card2:#161D29; --line:#1C2532; --line2:#2A3648;
  --ink:#F9F6F0; --muted:#9BA6B5;
  --accent:#2DD2DC; --on-accent:#031016; --accent-soft:#0B2C33; --accent-ink:#A5EDF2;
  --green:#3FE08A; --green-soft:#0F2E20; --amber:#F5C15E; --amber-soft:#3A2E10; --red:#FF8A8A; --red-soft:#3A1616;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{--logo:url("/brand/prenolia-dark.png");}
html{background:var(--bg);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,p{margin:0;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px;}
.logo{display:block;width:120px;height:30px;background:var(--logo) center / contain no-repeat;}

.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
.top-row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;}
.spacer{flex:1;}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 100px;}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
@media (min-width:820px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);}
.kpi .lbl{font-size:.85rem;color:var(--muted);font-weight:500;}
.kpi .val{margin-top:8px;font-size:1.9rem;font-weight:700;letter-spacing:-0.03em;}
.kpi .val.warn{color:var(--amber);}
.kpi .val.bad{color:var(--red);}
.kpi .sub{margin-top:4px;font-size:.8rem;color:var(--muted);}

.toolbar{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.search{flex:1;min-width:200px;position:relative;}
.search input{width:100%;min-height:46px;padding:0 16px 0 40px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.98rem;}
.search input:focus{outline:none;border-color:var(--accent);}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.filter{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.94rem;}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:.96rem;font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.08);}

.tablewrap{margin-top:18px;border-radius:22px;border:1px solid var(--line);background:var(--card);overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:1240px;}
th{text-align:left;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.who{display:flex;align-items:center;gap:12px;}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;}
.who b{display:block;font-size:.98rem;font-weight:600;white-space:nowrap;}
.who span{display:block;font-size:.8rem;color:var(--muted);}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;}
.pill.active{background:var(--green-soft);color:var(--green);}
.pill.trial{background:var(--accent-soft);color:var(--accent-ink);}
.pill.warn{background:var(--amber-soft);color:var(--amber);}
.pill.bad{background:var(--red-soft);color:var(--red);}
.plan-name{font-size:.9rem;color:var(--muted);margin-top:3px;}
.renew{font-weight:600;font-size:.94rem;}
.renew.warn{color:var(--amber);} .renew.bad{color:var(--red);}
.renew small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:1px;}
.mrr{font-weight:700;font-variant-numeric:tabular-nums;}
.appts{font-variant-numeric:tabular-nums;}
.contact a{display:block;color:var(--muted);font-size:.86rem;text-decoration:none;}
.contact a:hover{color:var(--accent-ink);}
.empty-row td{text-align:center;color:var(--muted);padding:40px 20px;}

/* pannello "nuovo cliente" */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card2);border-radius:26px 26px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.sheet.on{transform:translateY(0);}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 18px;}
.sheet h2{font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;}
.field{margin-top:16px;display:grid;gap:7px;}
.field label{font-size:.88rem;font-weight:500;color:var(--muted);}
.inp,select.inp{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sheet-actions{margin-top:22px;display:flex;gap:10px;}
.sheet-actions .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2);}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{transition:none;}}
nav{display:flex;gap:4px;}
nav a{padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;}
nav a.on{background:var(--card2);color:var(--ink);}
.pill.na{background:var(--card2);color:var(--muted);}
.health-reasons{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;max-width:240px;white-space:normal;line-height:1.35;}
.health-up{margin-top:6px;}
.svc-sub{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;white-space:normal;max-width:190px;line-height:1.35;}
.btn.small{min-height:36px;padding:0 14px;font-size:.86rem;border-radius:11px;}
.btn.danger{background:transparent;color:#FF8A8A;box-shadow:inset 0 0 0 1.5px #5A2A2A;}
.act-btn{justify-content:center;width:100%;}

.pagehd h1{font-size:1.6rem;letter-spacing:-0.02em;margin:0;}
.pagehd p{color:var(--muted);margin:6px 0 0;font-size:.95rem;line-height:1.45;}
.grid2{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr;}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr;}}
.card{border-radius:22px;border:1px solid var(--line);background:var(--card);padding:20px;}
.card.wide{grid-column:1/-1;}
.card h2{font-size:1.02rem;margin:0 0 4px;letter-spacing:-0.01em;}
.card .hint{color:var(--muted);font-size:.84rem;margin:0 0 14px;line-height:1.4;}
.bars{display:grid;gap:9px;}
.barrow{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:10px;font-size:.9rem;}
.barrow .track{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;}
.barrow .fill{height:100%;border-radius:99px;background:var(--accent);}
.barrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}
.stack{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px;}
.stack .col{flex:1;display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start;}
.stack .col i{display:block;width:100%;}
.stack .c-web{background:#2DD2DC;} .stack .c-telegram{background:#0AA2EE;} .stack .c-whatsapp{background:#3FE08A;}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:var(--muted);}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.74rem;margin-top:6px;}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:.7rem;color:var(--muted);align-items:center;}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--accent);}
.heat .h{text-align:center;}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;}
.tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl tr:last-child td{border-bottom:0;}
.tbl a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line2);}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tw{overflow-x:auto;}
.up{color:#3FE08A;} .down{color:#FF8A8A;}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0;}
.loading{color:var(--muted);padding:40px 0;text-align:center;}

.inp{width:100%;min-height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font:inherit;font-size:.95rem;}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px;}
.setrow{display:grid;grid-template-columns:1fr 130px 92px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);}
.setrow:first-of-type{border-top:0;}
.setrow small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px;}
@media (max-width:640px){.setrow{grid-template-columns:1fr 1fr;}.setrow .lab{grid-column:1/-1;}}
.prow{display:grid;grid-template-columns:1.6fr repeat(4,1fr) 92px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);}
.phead{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-top:0;}
@media (max-width:820px){.prow{grid-template-columns:1fr 1fr;}.prow.phead{display:none;}.prow .mname{grid-column:1/-1;font-weight:600;}}
.mname{font-size:.9rem;overflow-wrap:anywhere;}
.money-day{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px;}
.money-day i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;}
.money-day i.z{background:var(--card2);}
.todo{background:#3A2E12;color:#F5C15E;padding:12px 16px;border-radius:14px;margin:14px 0 0;font-size:.92rem;line-height:1.5;}
.todo b{display:block;margin-bottom:4px;}
.todo ul{margin:0;padding-left:18px;}
.info{background:#0F2B33;color:#9EE7F2;padding:12px 16px;border-radius:14px;margin:14px 0 0;font-size:.92rem;line-height:1.5;}
.neg{color:#FF8A8A;} .pos{color:#3FE08A;}
.saved{color:#3FE08A;font-size:.8rem;}
</style>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><span class="logo" role="img" aria-label="Prenolia"></span></div>
    <nav id="mainNav">
      <a href="/admin/clienti.html">I tuoi clienti</a>
      <a href="/admin/">Andamento</a>
      <a href="/admin/lia.html">Uso di Lia</a>
      <a href="/admin/soldi.html">Soldi</a>
      <a href="/admin/costi.html">Costi</a>
    </nav>
    <div class="spacer"></div>
  </div>
</header>
<script src="/admin/auth.js"></script>
<script src="/admin/nav.js"></script>

<div class="wrap">
  <div class="pagehd"><h1>Costi e margine</h1><p>Quanto ti costa ogni cliente e quanto ti resta. Costi variabili degli ultimi 30 giorni, incasso mensile.</p></div>
  <div id="root"><div class="loading">Carico i dati…</div></div>
</div>

<script>


(function(){
  var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var PIANO = { base:'Base', ai:'Base + Lia' };
  var eur2 = new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', minimumFractionDigits:0, maximumFractionDigits:2 });
  var eur4 = new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', minimumFractionDigits:0, maximumFractionDigits:4 });
  function eur(v){ if (v == null) return '—'; return Math.abs(v) > 0 && Math.abs(v) < 0.1 ? eur4.format(v) : eur2.format(v); }
  var root = document.getElementById('root');

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function d1(iso){ var d = new Date(iso); return d.getDate() + ' ' + MESI[d.getMonth()]; }
  function card(title, hint, wide){ var c = el('div', 'card' + (wide ? ' wide' : '')); c.appendChild(el('h2', null, title)); if (hint) c.appendChild(el('p','hint',hint)); return c; }
  function kpi(label, val, sub){ var k = el('div','kpi'); k.appendChild(el('div','lbl',label)); k.appendChild(el('div','val',val)); k.appendChild(el('div','sub',sub||'')); return k; }
  function num(v){ return v == null ? '—' : String(v).replace('.', ','); }
  function pctTxt(v){ return v == null ? '—' : num(v) + '%'; }

  function table(cols, rows){
    var wrap = el('div','tw'); var t = el('table','tbl'); var thead = el('thead'); var hr = el('tr');
    cols.forEach(function(c){ hr.appendChild(el('th', c.num ? 'num' : '', c.label)); }); thead.appendChild(hr); t.appendChild(thead);
    var tb = el('tbody'); rows.forEach(function(r){ var tr = el('tr'); cols.forEach(function(c){ var td = el('td', c.num ? 'num' : ''); c.render(td, r); tr.appendChild(td); }); tb.appendChild(tr); });
    t.appendChild(tb); wrap.appendChild(t); return wrap;
  }

  function save(payload, btn, note){
    btn.disabled = true;
    window.liaApi('/api/admin/clients', { method:'POST', body: JSON.stringify(payload) })
      .then(function(){ note.textContent = 'Salvato ✓'; note.className = 'saved'; return load(true); })
      .catch(function(e){ btn.disabled = false; alert('Non salvato: ' + e.message); });
  }

  var HELP = {
    usd_eur: 'Serve per trasformare in euro i costi dell\'AI, che Anthropic fattura in dollari.',
    msg_eur_whatsapp: 'Twilio e Meta fatturano ogni messaggio: controlla la tua fattura.',
    fixed_vercel: 'Abbonamento Vercel Pro: 20 $ al mese per persona.'
  };

  function render(d){
    root.innerHTML = '';
    var t = d.totals;

    if (d.todo && d.todo.length){
      var td = el('div','todo'); td.appendChild(el('b',null,'Da completare per avere numeri affidabili'));
      var ul = el('ul'); d.todo.forEach(function(x){ ul.appendChild(el('li',null,x)); }); td.appendChild(ul); root.appendChild(td);
    }
    if (d.warnings && d.warnings.length){ var w = el('div','todo','Alcune sezioni non sono leggibili al momento: ' + d.warnings.join(', ') + '.'); root.appendChild(w); }

    var k1 = el('div','kpis'); k1.style.marginTop = '16px';
    k1.appendChild(kpi('Incasso mensile', eur(t.mrr), 'clienti che pagano'));
    k1.appendChild(kpi('Costi variabili', eur(t.variable_cost), 'AI ' + eur(t.ai_cost) + ' · messaggi ' + eur(t.msg_cost)));
    k1.appendChild(kpi('Spese fisse', eur(t.fixed_cost), 'Vercel, Supabase, Twilio, altro'));
    var kn = kpi('Utile netto al mese', eur(t.net), t.net_margin_pct == null ? 'nessun incasso' : pctTxt(t.net_margin_pct) + ' dell\'incasso');
    kn.querySelector('.val').className = 'val ' + (t.net < 0 ? 'neg' : 'pos'); k1.appendChild(kn);
    root.appendChild(k1);

    var k2 = el('div','kpis'); k2.style.marginTop = '12px';
    k2.appendChild(kpi('Costo AI (30 giorni)', eur(t.ai_cost), t.calls + ' chiamate all\'AI'));
    k2.appendChild(kpi('Costo per messaggio ricevuto', t.ai_cost_per_msg == null ? '—' : eur(t.ai_cost_per_msg), t.user_msgs + ' messaggi dai clienti'));
    k2.appendChild(kpi('Margine medio cliente Lia', t.lia_avg_margin == null ? '—' : eur(t.lia_avg_margin), t.lia_avg_cost == null ? 'nessun cliente Lia con costi' : 'su ' + eur(t.lia_price) + ' · costo medio ' + eur(t.lia_avg_cost)));
    var kl = kpi('Clienti in perdita', String(t.losing), 'costano più di quanto pagano'); if (t.losing) kl.querySelector('.val').className = 'val neg'; k2.appendChild(kl);
    root.appendChild(k2);

    var g = el('div','grid2'); root.appendChild(g);

    if (!d.tracking.has_data){
      var inf = el('div','info','Il registro dei costi AI parte da quando carichi la modifica al backend (lib/usage.js e lib/lia.js): i costi delle risposte precedenti non sono recuperabili. Finché non arrivano dati, i costi qui sotto sono zero.');
      inf.style.gridColumn = '1/-1'; g.appendChild(inf);
    }

    // ---- clienti
    var cl = card('Chi ti fa guadagnare e chi no', 'Incasso del cliente meno costo AI e messaggi. Dal peggiore al migliore' + (d.clients_total > d.clients.length ? ' (primi ' + d.clients.length + ' su ' + d.clients_total + ')' : '') + '.', true);
    if (!d.clients.length) cl.appendChild(el('div','empty','Nessun dato.'));
    else cl.appendChild(table([
      { label:'Attività', render:function(td,r){ var a = el('a',null,r.name); a.href = '/admin/attivita.html?id=' + encodeURIComponent(r.id); td.appendChild(a); var s = el('div',null,r.type + (r.paying ? '' : ' · non paga')); s.style.cssText = 'color:var(--muted);font-size:.78rem;margin-top:2px;'; td.appendChild(s); } },
      { label:'Piano', render:function(td,r){ td.textContent = PIANO[r.plan] || '—'; } },
      { label:'Incasso', num:true, render:function(td,r){ td.textContent = eur(r.revenue); } },
      { label:'Costo AI', num:true, render:function(td,r){ td.textContent = eur(r.ai_cost); } },
      { label:'Messaggi', num:true, render:function(td,r){ td.textContent = eur(r.msg_cost); } },
      { label:'Margine', num:true, render:function(td,r){ td.textContent = eur(r.margin); td.className += r.margin < 0 ? ' neg' : ' pos'; td.style.fontWeight = '600'; } },
      { label:'Margine %', num:true, render:function(td,r){ td.textContent = r.margin_pct == null ? '—' : pctTxt(r.margin_pct); } },
      { label:'Chiamate AI', num:true, render:function(td,r){ td.textContent = String(r.calls); } }
    ], d.clients));
    g.appendChild(cl);

    // ---- giorno per giorno
    var dc = card('Costo AI al giorno', 'Ultimi 30 giorni.', true);
    var byDay = {}; d.per_day.forEach(function(x){ byDay[x.d] = x; });
    var days = []; for (var i = 29; i >= 0; i--){ var dt = new Date(Date.now() - i*86400000).toISOString().slice(0,10); days.push({ d: dt, cost: byDay[dt] ? byDay[dt].cost : 0 }); }
    var max = Math.max.apply(null, days.map(function(x){ return x.cost; })) || 1;
    var bars = el('div','money-day'); days.forEach(function(x){ var b = el('i', x.cost ? '' : 'z'); b.style.height = (x.cost ? Math.max(6, Math.round(x.cost/max*100)) : 3) + '%'; b.title = d1(x.d) + ': ' + eur(x.cost); bars.appendChild(b); });
    dc.appendChild(bars);
    var ax = el('div','axis'); ax.appendChild(el('span',null,d1(days[0].d))); ax.appendChild(el('span',null,d1(days[days.length-1].d))); dc.appendChild(ax);
    g.appendChild(dc);

    // ---- modelli
    var mc = card('Modelli usati', 'Chiamate e costo degli ultimi 30 giorni.');
    if (!d.by_model.length) mc.appendChild(el('div','empty','Nessuna chiamata registrata.'));
    d.by_model.forEach(function(m){ var li = el('div','li'); li.style.cssText = 'display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem;'; var l = el('div'); l.appendChild(el('div',null,m.model)); l.lastChild.style.overflowWrap = 'anywhere';
      var s = el('div',null,m.calls + ' chiamate' + (m.priced ? '' : ' · PREZZO MANCANTE')); s.style.cssText = 'color:' + (m.priced ? 'var(--muted)' : '#FF8A8A') + ';font-size:.78rem;margin-top:2px;'; l.appendChild(s);
      li.appendChild(l); li.appendChild(el('div',null,eur(m.cost))); mc.appendChild(li); });
    g.appendChild(mc);

    // ---- impostazioni
    var sc = card('Impostazioni dei costi', 'Cambio, costo dei messaggi e spese fisse mensili. Ogni modifica viene registrata.');
    d.settings.forEach(function(s){
      var row = el('div','setrow'); var lab = el('div','lab'); lab.appendChild(document.createTextNode(s.label));
      var sm = el('small',null,(s.set_by_user ? 'impostato da te' : 'valore di partenza: verificalo') + (HELP[s.key] ? ' · ' + HELP[s.key] : '')); lab.appendChild(sm); row.appendChild(lab);
      var inp = el('input','inp'); inp.type = 'number'; inp.step = 'any'; inp.min = '0'; inp.value = String(s.value); inp.setAttribute('inputmode','decimal'); row.appendChild(inp);
      var wrap = el('div'); var btn = el('button','btn ghost small','Salva'); btn.type = 'button'; var note = el('div','saved'); wrap.appendChild(btn); wrap.appendChild(note); row.appendChild(wrap);
      btn.addEventListener('click', function(){ save({ action:'set_setting', key:s.key, value:inp.value }, btn, note); });
      sc.appendChild(row);
    });
    g.appendChild(sc);

    // ---- listino prezzi
    var pc = card('Listino prezzi dell\'AI', 'Dollari per milione di token. Il prezzo del modello che usi è quello ufficiale di Anthropic (Haiku 4.5: 1 $ in entrata, 5 $ in uscita).');
    var hd = el('div','prow phead'); ['Modello','Entrata','Uscita','Scrittura cache','Lettura cache',''].forEach(function(x){ hd.appendChild(el('span',null,x)); }); pc.appendChild(hd);
    function priceRow(p, isNew){
      var row = el('div','prow'); var mn;
      if (isNew){ mn = el('input','inp'); mn.placeholder = 'nome del modello'; mn.className = 'inp mname'; row.appendChild(mn); } else { row.appendChild(el('span','mname',p.model)); }
      var ins = ['input','output','cache_write','cache_read'].map(function(f){ var i = el('input','inp'); i.type = 'number'; i.step = 'any'; i.min = '0'; i.setAttribute('inputmode','decimal'); i.value = p ? String(p[f]) : ''; i.title = f; row.appendChild(i); return i; });
      var wrap = el('div'); var btn = el('button','btn ghost small', isNew ? 'Aggiungi' : 'Salva'); btn.type = 'button'; var note = el('div','saved'); wrap.appendChild(btn); wrap.appendChild(note); row.appendChild(wrap);
      btn.addEventListener('click', function(){ save({ action:'set_price', model: isNew ? mn.value : p.model, input: ins[0].value, output: ins[1].value, cache_write: ins[2].value || 0, cache_read: ins[3].value || 0 }, btn, note); });
      pc.appendChild(row);
    }
    d.prices.forEach(function(p){ priceRow(p, false); });
    priceRow(null, true);
    g.appendChild(pc);
  }

  function load(silent){
    return window.liaApi('/api/admin/clients?view=margin').then(render).catch(function(e){ if (!silent) root.innerHTML = ''; window.liaBanner('Non riesco a caricare i dati: ' + e.message); });
  }
  load(false);
})();
</script>
</body>
</html>
