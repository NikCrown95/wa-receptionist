<!doctype html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prenolia Admin – I tuoi clienti</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--logo:url("/brand/prenolia-dark.png");
  --bg:#050608; --bg2:#0A0D12; --card:#0E131B; --card2:#161D29; --line:#1C2532; --line2:#2A3648;
  --ink:#F9F6F0; --muted:#9BA6B5;
  --accent:#2DD2DC; --on-accent:#031016; --accent-soft:#0B2C33; --accent-ink:#A5EDF2;
  --green:#3FE08A; --green-soft:#0F2E20; --amber:#F5C15E; --amber-soft:#3A2E10; --red:#FF8A8A; --red-soft:#3A1616;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{--logo:url("/brand/prenolia-dark.png");}
html{background:var(--bg);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,p{margin:0;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px;}
.logo{display:block;width:120px;height:30px;background:var(--logo) center / contain no-repeat;}

.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
.top-row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;}
.spacer{flex:1;}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 100px;}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
@media (min-width:820px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);}
.kpi .lbl{font-size:.85rem;color:var(--muted);font-weight:500;}
.kpi .val{margin-top:8px;font-size:1.9rem;font-weight:700;letter-spacing:-0.03em;}
.kpi .val.warn{color:var(--amber);}
.kpi .val.bad{color:var(--red);}
.kpi .sub{margin-top:4px;font-size:.8rem;color:var(--muted);}

.toolbar{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.search{flex:1;min-width:200px;position:relative;}
.search input{width:100%;min-height:46px;padding:0 16px 0 40px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.98rem;}
.search input:focus{outline:none;border-color:var(--accent);}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.filter{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:.94rem;}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:.96rem;font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.08);}

.tablewrap{margin-top:18px;border-radius:22px;border:1px solid var(--line);background:var(--card);overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:0;table-layout:auto;}
.avatar.has-logo{background:#fff;overflow:hidden;padding:0}.avatar.has-logo img{width:100%;height:100%;object-fit:cover;display:block}
.who .avatar{display:grid;place-items:center;color:var(--accent-ink);font-size:.85rem}
.who-contact,.plan-price{display:none}
@media (min-width:700px) and (max-width:899px){.health-reasons,.svc-sub,.who-contact a:nth-child(2){display:none}table th,table td{padding-left:7px !important;padding-right:7px !important}.who .avatar{width:32px;height:32px}.who{gap:8px}table th:nth-child(6),table td.appts{display:none}.wrap{padding-left:14px;padding-right:14px}}
@media (min-width:700px){th:nth-child(5),td.mrr,th:nth-child(8),td.contact{display:none}.who-contact{display:block;margin-top:3px}.who-contact a{display:block;color:var(--muted);font-size:.78rem;text-decoration:none;overflow-wrap:anywhere}.who-contact a:hover{color:var(--accent-ink)}.plan-price{display:block;margin-top:2px;font-size:.8rem;font-weight:600;color:var(--ink)}}
@media (min-width:700px){.health-reasons{max-width:170px}.svc-sub{max-width:130px}table th:nth-child(6){width:96px}td.act{white-space:normal}.act .btn{margin:0 0 6px 0 !important;display:flex;justify-content:center}table th{padding:12px 10px;white-space:normal;line-height:1.25;font-size:.72rem}table td{padding:12px 10px;font-size:.9rem}.who{gap:10px}.who b{white-space:normal;overflow-wrap:anywhere}.mrr{white-space:normal}.contact a{overflow-wrap:anywhere}.avatar{width:38px;height:38px}}
th{text-align:left;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.who{display:flex;align-items:center;gap:12px;}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;}
.who b{display:block;font-size:.98rem;font-weight:600;white-space:nowrap;}
.who span{display:block;font-size:.8rem;color:var(--muted);}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;}
.pill.active{background:var(--green-soft);color:var(--green);}
.pill.trial{background:var(--accent-soft);color:var(--accent-ink);}
.pill.warn{background:var(--amber-soft);color:var(--amber);}
.pill.bad{background:var(--red-soft);color:var(--red);}
.plan-name{font-size:.9rem;color:var(--muted);margin-top:3px;}
.renew{font-weight:600;font-size:.94rem;}
.renew.warn{color:var(--amber);} .renew.bad{color:var(--red);}
.renew small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:1px;}
.mrr{font-weight:700;font-variant-numeric:tabular-nums;}
.appts{font-variant-numeric:tabular-nums;}
.contact a{display:block;color:var(--muted);font-size:.86rem;text-decoration:none;}
.contact a:hover{color:var(--accent-ink);}
.empty-row td{text-align:center;color:var(--muted);padding:40px 20px;}

/* pannello "nuovo cliente" */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card2);border-radius:26px 26px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.sheet.on{transform:translateY(0);}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 18px;}
.sheet h2{font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;}
.field{margin-top:16px;display:grid;gap:7px;}
.field label{font-size:.88rem;font-weight:500;color:var(--muted);}
.inp,select.inp{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sheet-actions{margin-top:22px;display:flex;gap:10px;}
.sheet-actions .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2);}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{transition:none;}}
nav{display:flex;gap:4px;}
nav a{padding:8px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;}
nav a.on{background:var(--card2);color:var(--ink);}
.pill.na{background:var(--card2);color:var(--muted);}
.health-reasons{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;max-width:240px;white-space:normal;line-height:1.35;}
.health-up{margin-top:6px;}
.svc-sub{display:block;font-size:.78rem;color:var(--muted);margin-top:5px;white-space:normal;max-width:190px;line-height:1.35;}
.btn.small{min-height:36px;padding:0 14px;font-size:.86rem;border-radius:11px;}
.btn.danger{background:transparent;color:#FF8A8A;box-shadow:inset 0 0 0 1.5px #5A2A2A;}
.act-btn{justify-content:center;width:100%;}
</style>
<link rel="manifest" href="/admin/manifest.webmanifest"><meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Prenolia Admin"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="icon" type="image/png" sizes="64x64" href="/admin/icons/admin-64.png?v=6"><link rel="icon" type="image/png" sizes="512x512" href="/admin/icons/admin-512.png?v=6"><link rel="apple-touch-icon" href="/admin/icons/admin-apple-180.png?v=6">
<link rel="stylesheet" href="/admin/mobile.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><span class="logo" role="img" aria-label="Prenolia"></span></div>
    <nav id="mainNav">
      <a href="/admin/clienti.html">I tuoi clienti</a>
      <a href="/admin/">Andamento</a>
      <a href="/admin/lia.html">Uso di Lia</a>
      <a href="/admin/soldi.html">Stream of income</a>
      <a href="/admin/costi.html">Costi</a>
    </nav>
    <div class="spacer"></div>
  </div>
</header>
<script src="/admin/auth.js"></script>
<script src="/admin/nav.js"></script>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search" type="text" placeholder="Cerca per nome attività…">
    </div>
    <select class="filter" id="filterStatus">
      <option value="">Tutti gli stati</option>
      <option value="active">Attivo</option>
      <option value="trial">In prova</option>
      <option value="past_due">Scaduto</option>
      <option value="cancelled">Annullato</option>
    </select>
    <select class="filter" id="filterService">
      <option value="">Tutti i servizi</option>
      <option value="active">Servizio attivo</option>
      <option value="grace">In tolleranza</option>
      <option value="suspended">Sospeso</option>
    </select>
    <select class="filter" id="filterHealth">
      <option value="">Salute: tutte</option>
      <option value="red">A rischio</option>
      <option value="yellow">Da controllare</option>
      <option value="green">Regolare</option>
      <option value="upgrade">Candidati Lia</option>
    </select>
    <button class="btn" id="addBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Nuovo cliente
    </button>
  </div>

  <div class="tablewrap cards-wrap">
    <table class="cards">
      <thead><tr>
        <th>Attività</th><th>Piano e stato</th><th>Rinnovo</th><th>Servizio</th><th>Incasso</th><th>Appuntamenti (30gg)</th><th>Stato</th><th>Contatti</th><th>Azioni</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="sheet-bg" id="actBg"></div>
<div class="sheet" id="actSheet" role="dialog" aria-modal="true" aria-labelledby="actTitle" tabindex="-1">
  <div class="grabber" aria-hidden="true"></div>
  <h2 id="actTitle"></h2>
  <p id="actSub" style="margin:6px 0 0;color:var(--muted);font-size:.92rem;line-height:1.45;"></p>
  <div class="sheet-actions" id="actBtns" style="flex-direction:column;"></div>
  <div class="sheet-actions" style="margin-top:10px;"><button class="btn ghost" id="actClose" type="button" style="flex:1;justify-content:center;">Chiudi</button></div>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="grabber" aria-hidden="true"></div>
  <h2 id="sheetTitle">Nuovo cliente</h2>
  <form id="addForm">
    <div class="field"><label for="nName">Nome dell'attività</label><input class="inp" id="nName" required placeholder="Es. Estetica Giulia"></div>
    <div class="row2">
      <div class="field"><label for="nType">Tipo</label>
        <select class="inp" id="nType">
          <option>Parrucchiere</option><option>Barbiere</option><option>Estetista</option><option>Idraulico</option><option>Personal trainer</option>
        </select>
      </div>
      <div class="field"><label for="nPlan">Piano</label>
        <select class="inp" id="nPlan">
          <option value="ai">Smart — 24,99 €/mese</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label for="nPhone">Telefono del titolare</label><input class="inp" id="nPhone" required placeholder="345 123 4567"></div>
      <div class="field"><label for="nStatus">Stato iniziale</label>
        <select class="inp" id="nStatus">
          <option value="trial">In prova (14 giorni)</option>
          <option value="active">Attivo da subito</option>
        </select>
      </div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="cancelAdd">Annulla</button>
      <button type="submit" class="btn">Aggiungi cliente</button>
    </div>
  </form>
</div>

<script>
window.startClients = function(){
  var PLAN_PRICE = { base: 39.99, ai: 24.99 };
  var PLAN_LABEL = { base: 'Base', ai: 'Smart' };
  var STATUS_LABEL = { active: 'Attivo', trial: 'In prova', past_due: 'Scaduto', cancelled: 'Annullato', none: 'Senza piano' };
  var eur = new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', minimumFractionDigits:0, maximumFractionDigits:2 });
  var today = new Date(); today.setHours(0,0,0,0);

  function d(days){ var x = new Date(today); x.setDate(x.getDate() + days); return x; }
  function fmtDate(dt){ return dt.getDate() + ' ' + ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][dt.getMonth()]; }
  function daysUntil(dt){ return Math.round((dt - today) / 86400000); }

  var CLIENTS = [];

  function initials(name){ return name.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }

  function renewInfo(c){
    if (c.status === 'none' || !c.renew || isNaN(c.renew)) return { text: '—', cls:'', sub:'' };
    if (c.status === 'cancelled') return { text: 'Annullato il ' + fmtDate(c.renew), cls:'' , sub:''};
    if (c.status === 'trial'){
      var dd = daysUntil(c.renew);
      return { text: dd <= 3 ? 'Prova finisce tra ' + dd + ' g' : fmtDate(c.renew), cls: dd <= 3 ? 'warn' : '', sub:'Fine prova' };
    }
    var dd2 = daysUntil(c.renew);
    if (dd2 < 0) return { text: fmtDate(c.renew), cls:'bad', sub: Math.abs(dd2) + ' giorni di ritardo' };
    if (dd2 <= 7) return { text: fmtDate(c.renew), cls:'warn', sub: 'tra ' + dd2 + ' giorni' };
    return { text: fmtDate(c.renew), cls:'', sub: 'tra ' + dd2 + ' giorni' };
  }

  function statusPillClass(s){ return s === 'active' ? 'active' : (s === 'trial' ? 'trial' : ((s === 'past_due' || s === 'none') ? 'warn' : 'bad')); }

  function renderKpis(){
    var active = CLIENTS.filter(function(c){ return c.status === 'active'; });
    var paying = active.filter(function(c){ return !(c.service && c.service.state === 'suspended'); });
    var mrr = paying.reduce(function(s,c){ return s + (PLAN_PRICE[c.plan] || 0); }, 0);
    var soon = CLIENTS.filter(function(c){ return (c.status === 'active') && daysUntil(c.renew) >= 0 && daysUntil(c.renew) <= 7; }).length;
    var cancelled = CLIENTS.filter(function(c){ return c.status === 'cancelled'; }).length;
    var totalEver = CLIENTS.length;
    var churn = totalEver ? Math.round(cancelled / totalEver * 100) : 0;

    var cards = [
      { lbl:'Incasso mensile (MRR)', val: eur.format(mrr), sub: paying.length + (paying.length === 1 ? ' cliente che paga' : ' clienti che pagano') },
      { lbl:'Clienti attivi', val: String(active.length), sub: CLIENTS.filter(function(c){return c.status==='trial';}).length + ' in prova · ' + CLIENTS.filter(function(c){ return c.health && c.health.level === 'red'; }).length + ' a rischio' },
      { lbl:'In scadenza entro 7 giorni', val: String(soon), cls: soon ? 'warn' : '', sub: 'Da ricontattare' },
      { lbl:'Tasso di abbandono', val: churn + '%', cls: churn ? 'bad' : '', sub: cancelled + ' annullati in totale' }
    ];
    var box = document.getElementById('kpis');
    box.innerHTML = '';
    cards.forEach(function(c){
      var el = document.createElement('div'); el.className = 'kpi';
      el.innerHTML = '<div class="lbl"></div><div class="val"></div><div class="sub"></div>';
      el.querySelector('.lbl').textContent = c.lbl;
      var v = el.querySelector('.val'); v.textContent = c.val; if (c.cls) v.classList.add(c.cls);
      el.querySelector('.sub').textContent = c.sub;
      box.appendChild(el);
    });
  }

  function renderRows(){
    var q = document.getElementById('search').value.trim().toLowerCase();
    var fp = '';
    var fs = document.getElementById('filterStatus').value;
    var fh = document.getElementById('filterHealth').value;
    var fsv = document.getElementById('filterService').value;
    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';

    var list = CLIENTS.filter(function(c){
      if (q && c.name.toLowerCase().indexOf(q) === -1) return false;
      if (fp && c.plan !== fp) return false;
      if (fs && c.status !== fs) return false;
      if (fsv && !(c.service && c.service.state === fsv)) return false;
      if (fh === 'upgrade') { if (!(c.health && c.health.upgrade)) return false; }
      else if (fh && !(c.health && c.health.level === fh)) return false;
      return true;
    });

    if (!list.length){
      tbody.innerHTML = '<tr class="empty-row"><td colspan="9">Nessun cliente trovato.</td></tr>';
      return;
    }

    list.forEach(function(c){
      var r = renewInfo(c);
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="who"><span class="avatar"></span><div><b></b><span class="type"></span></div></div></td>' +
        '<td><span class="pill"></span><div class="plan-name"></div></td>' +
        '<td><div class="renew"></div></td>' +
        '<td class="svc"></td>' +
        '<td class="mrr"></td>' +
        '<td class="appts"></td>' +
        '<td class="health"></td>' +
        '<td class="contact"></td>' +
        '<td class="act"></td>';
      ['Attività','Piano e stato','Rinnovo','Servizio','Incasso','Appuntamenti (30gg)','Stato','Contatti','Azioni'].forEach(function(l, i){ tr.children[i].setAttribute('data-l', l); });

      var av = tr.querySelector('.avatar'); av.textContent = initials(c.name);
      if (c.logo_url) { var im = document.createElement('img'); im.alt = ''; im.src = c.logo_url; im.addEventListener('load', function(){ av.textContent = ''; av.classList.add('has-logo'); av.appendChild(im); }); }
      var nameEl = tr.querySelector('.who b');
      if (c.id) {
        var nameLink = document.createElement('a'); nameLink.href = '/admin/attivita.html?id=' + encodeURIComponent(c.id);
        nameLink.textContent = c.name; nameLink.style.cssText = 'color:inherit;text-decoration:none;border-bottom:1px dashed var(--line2);';
        nameEl.appendChild(nameLink);
      } else { nameEl.textContent = c.name; }
      tr.querySelector('.who .type').textContent = c.type;
      if (c.referred_by && c.referred_by.via) tr.querySelector('.who .type').textContent = c.type + ' \u00b7 registrato tramite il link di ' + c.referred_by.via + (c.referred_by.status === 'paid' ? ' (ha pagato)' : ' (in prova)');

      var pill = tr.querySelector('.pill');
      pill.textContent = STATUS_LABEL[c.status];
      pill.classList.add(statusPillClass(c.status));
      tr.querySelector('.plan-name').textContent = PLAN_LABEL[c.plan] || 'Nessun piano';

      var renewEl = tr.querySelector('.renew');
      renewEl.textContent = r.text;
      if (r.cls) renewEl.classList.add(r.cls);
      if (r.sub){ var sm = document.createElement('small'); sm.textContent = r.sub; renewEl.appendChild(sm); }

      tr.querySelector('.mrr').textContent = (c.status === 'cancelled' || !c.plan) ? '—' : eur.format(PLAN_PRICE[c.plan]) + '/mese';
      tr.querySelector('.appts').textContent = c.appts;

      // ----- servizio (regola unica del database)
      var sc = tr.querySelector('.svc');
      var sv = c.service;
      if (!sv) { sc.textContent = '—'; }
      else {
        var SVC = { active: ['Attivo', 'active'], grace: ['In tolleranza', 'warn'], suspended: ['Sospeso', 'bad'], cancelled: ['Annullato', 'na'], unmanaged: ['Non gestito', 'na'] };
        var sm = SVC[sv.state] || [sv.state, 'na'];
        var sp = document.createElement('span'); sp.className = 'pill ' + sm[1]; sp.textContent = sm[0]; sc.appendChild(sp);
        var note = '';
        var pu = sv.paid_until ? new Date(sv.paid_until) : null;
        if (sv.state === 'active' && pu) note = (c.status === 'trial' ? 'prova fino al ' : 'pagato fino al ') + fmtDate(pu);
        else if (sv.state === 'grace' && sv.grace_ends) note = 'scaduto: tolleranza fino al ' + fmtDate(new Date(sv.grace_ends));
        else if (sv.state === 'suspended') note = (pu && pu > new Date()) ? 'sospeso a mano' : (pu ? 'scaduto il ' + fmtDate(pu) : 'sospeso');
        else if (sv.state === 'unmanaged') note = 'nessun abbonamento: sempre attivo';
        if (note) { var sn = document.createElement('span'); sn.className = 'svc-sub'; sn.textContent = note; sc.appendChild(sn); }
      }

      var ac = tr.querySelector('.act');
      if (c.id) {
        var sb2 = document.createElement('a'); sb2.href = '/admin/attivita.html?id=' + encodeURIComponent(c.id); sb2.className = 'btn ghost small'; sb2.textContent = 'Scheda'; sb2.style.cssText = 'text-decoration:none;margin-right:8px;';
        ac.appendChild(sb2);
      }
      var ab = document.createElement('button'); ab.type = 'button'; ab.className = 'btn ghost small'; ab.textContent = 'Azioni';
      ab.addEventListener('click', function(){ openActions(c); });
      ac.appendChild(ab);

      var hc = tr.querySelector('.health');
      var hh = c.health || { level: 'na', label: '—', reasons: [], upgrade: false };
      var hp = document.createElement('span');
      hp.className = 'pill ' + (hh.level === 'green' ? 'active' : hh.level === 'yellow' ? 'warn' : hh.level === 'red' ? 'bad' : 'na');
      hp.textContent = hh.level === 'green' ? 'Regolare' : hh.label;
      hc.appendChild(hp);
      if (hh.reasons && hh.reasons.length) {
        var hr = document.createElement('span'); hr.className = 'health-reasons'; hr.textContent = hh.reasons.join(' · ');
        hc.appendChild(hr);
      }
      if (hh.upgrade) {
        var hu = document.createElement('div'); hu.className = 'health-up';
        var hup = document.createElement('span'); hup.className = 'pill trial'; hup.textContent = 'Candidato Lia';
        hu.appendChild(hup); hc.appendChild(hu);
      }

      var contact = tr.querySelector('.contact');
      if (c.phone) { var telLink = document.createElement('a'); telLink.href = 'tel:' + c.phone.replace(/\s+/g,''); telLink.textContent = c.phone; contact.appendChild(telLink); } else { contact.textContent = '—'; }
      if (c.email){ var mailLink = document.createElement('a'); mailLink.href = 'mailto:' + c.email; mailLink.textContent = c.email; contact.appendChild(mailLink); }

      var wc = document.createElement('div'); wc.className = 'who-contact';
      [c.phone && ['tel:' + c.phone.replace(/\s+/g,''), c.phone], c.email && ['mailto:' + c.email, c.email]].forEach(function(x){ if (!x) return; var a = document.createElement('a'); a.href = x[0]; a.textContent = x[1]; wc.appendChild(a); });
      if (wc.firstChild) tr.querySelector('.who > div').appendChild(wc);
      var pp = document.createElement('div'); pp.className = 'plan-price'; pp.textContent = tr.querySelector('.mrr').textContent;
      if (pp.textContent && pp.textContent !== '\u2014') tr.querySelector('.plan-name').parentNode.appendChild(pp);

      tbody.appendChild(tr);
    });
  }

  (function(){ var fs = document.getElementById('filterStatus'); if (fs && !fs.querySelector('option[value=none]')) { var o = document.createElement('option'); o.value = 'none'; o.textContent = 'Senza piano'; fs.appendChild(o); } })();
  function renderAll(){ renderKpis(); renderRows(); }

  document.getElementById('search').addEventListener('input', renderRows);
  document.getElementById('filterStatus').addEventListener('change', renderRows);
  document.getElementById('filterHealth').addEventListener('change', renderRows);
  document.getElementById('filterService').addEventListener('change', renderRows);

  var sheetBg = document.getElementById('sheetBg');
  var sheet = document.getElementById('sheet');
  function openSheet(){ sheetBg.classList.add('on'); sheet.classList.add('on'); document.getElementById('nName').focus(); }
  function closeSheet(){ sheetBg.classList.remove('on'); sheet.classList.remove('on'); }
  document.getElementById('addBtn').addEventListener('click', openSheet);
  document.getElementById('cancelAdd').addEventListener('click', closeSheet);
  sheetBg.addEventListener('click', closeSheet);

  document.getElementById('addForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var name = document.getElementById('nName').value.trim();
    var phone = document.getElementById('nPhone').value.trim();
    if (!name || !phone) return;
    var payload = { name: name, phone: phone, type: document.getElementById('nType').value,
      plan: document.getElementById('nPlan').value, status: document.getElementById('nStatus').value };
    var btn = ev.target.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
    window.liaApi('/api/admin/clients', { method: 'POST', body: JSON.stringify(payload) })
      .then(function(){ document.getElementById('addForm').reset(); closeSheet(); window.liaReload(); })
      .catch(function(e){ alert('Non sono riuscito a salvare: ' + e.message); })
      .then(function(){ if (btn) btn.disabled = false; });
  });

  // ===== pannello azioni (pagamenti, proroghe, sospensione, piano)
  var actBg = document.getElementById('actBg'), actSheet = document.getElementById('actSheet');
  function closeActions(){ actBg.classList.remove('on'); actSheet.classList.remove('on'); }
  document.getElementById('actClose').addEventListener('click', closeActions);
  actBg.addEventListener('click', closeActions);

  function runAction(c, payload, confirmText, btn){
    if (confirmText && !window.confirm(confirmText)) return;
    var all = document.querySelectorAll('#actBtns button'); all.forEach(function(b){ b.disabled = true; });
    payload.id = c.id;
    window.liaApi('/api/admin/clients', { method: 'POST', body: JSON.stringify(payload) })
      .then(function(res){ closeActions(); window.liaReload().then(function(){ if (res && res.note) alert(res.note); }); })
      .catch(function(e){ all.forEach(function(b){ b.disabled = false; }); alert('Non riuscito: ' + e.message); });
  }

  function openActions(c){
    var box = document.getElementById('actBtns'); box.innerHTML = '';
    document.getElementById('actTitle').textContent = c.name;
    var sv = c.service, st = sv ? sv.state : null;
    var planTxt = c.plan ? PLAN_LABEL[c.plan] : 'nessun piano';
    document.getElementById('actSub').textContent = planTxt + ' · ' + (STATUS_LABEL[c.status] || '') + (sv && sv.paid_until && c.status !== 'cancelled' ? ' · pagato fino al ' + fmtDate(new Date(sv.paid_until)) : '');

    function add(label, cls, payload, confirmText){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn act-btn ' + (cls || 'ghost'); b.textContent = label;
      b.addEventListener('click', function(){ runAction(c, payload, confirmText, b); });
      box.appendChild(b);
    }

    var pb = document.createElement('button'); pb.type = 'button'; pb.className = 'btn act-btn'; pb.textContent = 'Gestisci piano…';
    pb.addEventListener('click', function(){ openPlanForm(c); });
    box.appendChild(pb);
    var rb = document.createElement('button'); rb.type = 'button'; rb.className = 'btn ghost act-btn'; rb.textContent = 'Reset password…';
    rb.addEventListener('click', function(){ openPasswordForm(c); });
    box.appendChild(rb);

    if (c.status === 'none') {
      add('Assegna piano Smart (24,99 €/mese)', '', { action: 'assign_plan', plan: 'ai' });
      add('Smart in prova gratuita (14 giorni)', 'ghost', { action: 'assign_plan', plan: 'ai', status: 'trial' });
    } else if (c.status === 'cancelled') {
      add('Riattiva (1 mese da oggi)', '', { action: 'reactivate' }, 'Riattivare ' + c.name + ' per 1 mese a partire da oggi?');
    } else {
      add('Segna come pagato (+1 mese)', '', { action: 'mark_paid', months: 1 });
      add('Proroga di 7 giorni', 'ghost', { action: 'extend', days: 7 });
      add('Proroga di 30 giorni', 'ghost', { action: 'extend', days: 30 });
      var ub = document.createElement('button'); ub.type = 'button'; ub.className = 'btn ghost act-btn'; ub.textContent = 'Proroga fino a una data…';
      ub.addEventListener('click', function(){ openUntilForm(c); });
      box.appendChild(ub);
      var manual = st === 'suspended' && sv && sv.paid_until && new Date(sv.paid_until) > new Date();
      if (st === 'suspended') add(manual ? 'Riattiva (toglie la sospensione)' : 'Riattiva (se scaduto serve pagamento o proroga)', 'ghost', { action: 'reactivate' });
      else add('Sospendi ora', 'danger', { action: 'suspend' }, 'Sospendere ' + c.name + ' adesso? Lia e le prenotazioni online smettono di funzionare.');
      if (c.plan === 'base') add('Passa a Smart', 'ghost', { action: 'assign_plan', plan: 'ai' }, 'Passare ' + c.name + ' a Smart?');
      add('Annulla abbonamento', 'danger', { action: 'cancel' }, 'Annullare l\'abbonamento di ' + c.name + '? Il servizio si ferma subito.');
    }
    var del = document.createElement('button'); del.type = 'button'; del.className = 'btn act-btn danger'; del.textContent = 'Elimina attività…'; del.style.marginTop = '14px';
    del.addEventListener('click', function(){ openDeleteForm(c); });
    box.appendChild(del);
    actBg.classList.add('on'); actSheet.classList.add('on');
  }

  // ===== elimina attività: definitivo, si conferma scrivendo il nome
  function openDeleteForm(c){
    var box = document.getElementById('actBtns'); box.innerHTML = '';
    document.getElementById('actTitle').textContent = 'Elimina ' + c.name;
    var sub = document.getElementById('actSub');
    sub.textContent = 'Operazione definitiva: non si può annullare.';
    function el(tag, css, text){ var e = document.createElement(tag); if (css) e.style.cssText = css; if (text != null) e.textContent = text; return e; }
    box.appendChild(el('p', 'margin:0 0 4px;font-size:.92rem;line-height:1.5;color:var(--ink);', 'Spariscono per sempre: appuntamenti e storico, clienti e note, servizi, orari, collaboratori, chat con Lia, abbonamento e accesso del titolare.' + (c.appts ? ' Questa attività ha ' + c.appts + ' appuntamenti.' : '')));
    box.appendChild(el('p', 'margin:0 0 10px;font-size:.88rem;line-height:1.5;color:var(--muted);', 'Se al titolare servono i suoi dati, fai prima l\'esportazione dalla sua dashboard. Se ha un abbonamento Stripe, annullalo prima su Stripe.'));
    var lab = el('label', 'display:block;font-size:.84rem;color:var(--muted);margin:4px 0 6px;', 'Per confermare scrivi esattamente: ');
    lab.appendChild(el('b', 'color:var(--ink);', c.name)); lab.htmlFor = 'delName'; box.appendChild(lab);
    var inp = document.createElement('input'); inp.id = 'delName'; inp.type = 'text'; inp.className = 'inp'; inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false; inp.placeholder = c.name; inp.style.cssText = 'width:100%;font-size:16px;min-height:48px;';
    box.appendChild(inp);
    var err = el('div', 'min-height:1.3em;margin:8px 0 2px;font-size:.88rem;color:#FF8A8A;line-height:1.4;'); err.setAttribute('role', 'alert'); box.appendChild(err);
    function norm(s){ return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
    var go = document.createElement('button'); go.type = 'button'; go.className = 'btn act-btn'; go.textContent = 'Elimina definitivamente'; go.disabled = true;
    go.style.cssText = 'background:#FF8A8A;color:#2a0a0a;';
    inp.addEventListener('input', function(){ go.disabled = norm(inp.value) !== norm(c.name); err.textContent = ''; });
    go.addEventListener('click', function(){
      go.disabled = true; inp.disabled = true; go.textContent = 'Elimino…';
      window.liaApi('/api/admin/clients', { method: 'POST', body: JSON.stringify({ action: 'delete_business', id: c.id, confirm_name: inp.value }) })
        .then(function(res){
          box.innerHTML = ''; document.getElementById('actTitle').textContent = 'Attività eliminata';
          var n = res && res.counts ? res.counts : {};
          sub.textContent = (res && res.deleted ? res.deleted : c.name) + ' non esiste più' + (n.appuntamenti ? ' (tolti ' + n.appuntamenti + ' appuntamenti)' : '') + '.';
          var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn act-btn'; ok.textContent = 'Chiudi'; ok.addEventListener('click', closeActions); box.appendChild(ok);
          window.liaReload();
        })
        .catch(function(e){ err.textContent = e.message; inp.disabled = false; go.textContent = 'Elimina definitivamente'; go.disabled = norm(inp.value) !== norm(c.name); });
    });
    box.appendChild(go);
    var back = document.createElement('button'); back.type = 'button'; back.className = 'btn ghost act-btn'; back.textContent = 'Indietro'; back.addEventListener('click', function(){ openActions(c); }); box.appendChild(back);
    setTimeout(function(){ try { inp.focus(); } catch (e) {} }, 60);
  }

  // ===== "Gestisci piano": piano + stato + durata, anche per chi ha già un abbonamento
  function openPlanForm(c){
    var box = document.getElementById('actBtns'); box.innerHTML = '';
    document.getElementById('actTitle').textContent = 'Piano di ' + c.name;
    var locked = c.status === 'active'; // un cliente già attivo non torna in prova
    document.getElementById('actSub').textContent = (c.plan ? PLAN_LABEL[c.plan] : 'Nessun piano') + ' · ' + (STATUS_LABEL[c.status] || '') + '. Scegli come deve essere da adesso.';

    function field(label, el){
      var w = document.createElement('div'); w.className = 'field'; w.style.marginTop = '4px';
      var l = document.createElement('label'); l.textContent = label; w.appendChild(l); w.appendChild(el); return w;
    }
    function sel(opts, val){
      var s = document.createElement('select'); s.className = 'inp';
      opts.forEach(function(o){ var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; s.appendChild(op); });
      s.value = String(val); return s;
    }
    var selPlan = sel([['ai', 'Smart (24,99 €/mese)']], 'ai');
    var statusOpts = locked ? [['active', 'Attivo (pagato)']] : [['trial', 'In prova gratuita'], ['active', 'Attivo (pagato)']];
    var selStatus = sel(statusOpts, locked ? 'active' : ('trial'));
    var selDur = document.createElement('select'); selDur.className = 'inp';
    var note = document.createElement('p'); note.style.cssText = 'margin:2px 0 0;font-size:.9rem;line-height:1.45;color:var(--muted);';

    function fillDur(){
      var trial = selStatus.value === 'trial';
      var opts = trial ? [[7,'7 giorni'],[14,'14 giorni (standard)'],[30,'30 giorni'],[60,'60 giorni'],[90,'90 giorni']] : [[1,'1 mese'],[3,'3 mesi'],[6,'6 mesi'],[12,'12 mesi']];
      selDur.innerHTML = '';
      opts.forEach(function(o){ var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; selDur.appendChild(op); });
      selDur.value = trial ? '14' : '1';
      durLabel.textContent = trial ? 'Durata della prova' : 'Periodo pagato';
      upd();
    }
    var selStart = document.createElement('input'); selStart.type = 'date'; selStart.className = 'inp';
    var today = new Date(); var todayIso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    selStart.value = todayIso;
    function endDate(){
      var t = selStart.value ? new Date(selStart.value + 'T12:00:00') : new Date(); var n = parseInt(selDur.value, 10);
      if (selStatus.value === 'trial') t.setDate(t.getDate() + n); else t.setMonth(t.getMonth() + n);
      return t;
    }
    function upd(){
      var dt = endDate();
      note.textContent = (selStatus.value === 'trial' ? 'La prova finisce il ' : 'Il servizio è coperto fino al ') + dt.getDate() + ' ' + ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'][dt.getMonth()] + ' ' + dt.getFullYear() + '. Il conto parte ' + (selStart.value === todayIso || !selStart.value ? 'da oggi' : 'dal ' + new Date(selStart.value + 'T12:00:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' })) + ' e toglie sospensioni e proroghe già date.';
    }
    var durWrap = field('', selDur); var durLabel = durWrap.querySelector('label');
    selStatus.addEventListener('change', fillDur); selDur.addEventListener('change', upd); selStart.addEventListener('input', upd);

    box.appendChild(field('Piano', selPlan));
    box.appendChild(field('Stato', selStatus));
    box.appendChild(durWrap);
    box.appendChild(field('Parte dal', selStart));
    box.appendChild(note);
    fillDur();

    var apply = document.createElement('button'); apply.type = 'button'; apply.className = 'btn act-btn'; apply.textContent = 'Applica piano'; apply.style.marginTop = '8px';
    apply.addEventListener('click', function(){
      var trial = selStatus.value === 'trial';
      var payload = { action: 'apply_plan', plan: selPlan.value, status: selStatus.value };
      if (trial) payload.days = parseInt(selDur.value, 10); else payload.months = parseInt(selDur.value, 10);
      if (selStart.value && selStart.value !== todayIso) payload.start_on = selStart.value;
      var txt = 'Applicare a ' + c.name + ': ' + (selPlan.value === 'ai' ? 'Smart' : 'Base') + ', ' + (trial ? 'in prova per ' + selDur.value + ' giorni' : 'attivo per ' + selDur.value + (selDur.value === '1' ? ' mese' : ' mesi')) + (payload.start_on ? ', a partire dal ' + new Date(payload.start_on + 'T12:00:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'long' }) : '') + '?';
      if (c.status === 'cancelled') txt += ' L\'abbonamento annullato verrà riattivato.';
      runAction(c, payload, txt, apply);
    });
    box.appendChild(apply);
    var back = document.createElement('button'); back.type = 'button'; back.className = 'btn ghost act-btn'; back.textContent = 'Indietro';
    back.addEventListener('click', function(){ openActions(c); });
    box.appendChild(back);
  }

  // ===== "Reset password": link via email oppure password provvisoria
  // ===== proroga fino a una data scelta
  function openUntilForm(c){
    var box = document.getElementById('actBtns'); box.innerHTML = '';
    document.getElementById('actTitle').textContent = 'Proroga ' + c.name;
    document.getElementById('actSub').textContent = 'L\'attività resta attiva fino alla fine del giorno che scegli, poi si ferma se non viene rinnovata.';
    var lab = document.createElement('label'); lab.htmlFor = 'untilDate'; lab.textContent = 'Attiva fino al';
    lab.style.cssText = 'display:block;font-size:.84rem;color:var(--muted);margin:4px 0 6px;';
    var inp = document.createElement('input'); inp.type = 'date'; inp.id = 'untilDate';
    var d0 = new Date(Date.now() + 30 * 86400000); inp.value = d0.toISOString().slice(0, 10);
    inp.min = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    inp.style.cssText = 'width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 12px;margin-bottom:12px;';
    box.appendChild(lab); box.appendChild(inp);
    var go = document.createElement('button'); go.type = 'button'; go.className = 'btn act-btn'; go.textContent = 'Conferma proroga';
    go.addEventListener('click', function(){
      if (!inp.value) { alert('Scegli una data.'); return; }
      runAction(c, { action: 'extend', until: inp.value }, 'Tenere attiva ' + c.name + ' fino al ' + inp.value.split('-').reverse().join('/') + '?', go);
    });
    box.appendChild(go);
    var back = document.createElement('button'); back.type = 'button'; back.className = 'btn ghost act-btn'; back.textContent = 'Indietro';
    back.addEventListener('click', function(){ openActions(c); });
    box.appendChild(back);
  }

  function openPasswordForm(c){
    var box = document.getElementById('actBtns'); box.innerHTML = '';
    document.getElementById('actTitle').textContent = 'Password di ' + c.name;
    var sub = document.getElementById('actSub');
    sub.textContent = 'Scegli come aiutare il titolare ad entrare di nuovo.';
    function btn(label, cls, fn){ var b = document.createElement('button'); b.type = 'button'; b.className = 'btn act-btn ' + (cls || 'ghost'); b.textContent = label; b.addEventListener('click', fn); box.appendChild(b); return b; }
    function hint(t){ var p = document.createElement('p'); p.style.cssText = 'margin:0 0 6px;font-size:.88rem;line-height:1.45;color:var(--muted);'; p.textContent = t; box.appendChild(p); }
    function call(mode, done, b){
      var all = box.querySelectorAll('button'); all.forEach(function(x){ x.disabled = true; });
      window.liaApi('/api/admin/clients', { method: 'POST', body: JSON.stringify({ action: 'reset_password', id: c.id, mode: mode }) })
        .then(done)
        .catch(function(e){ all.forEach(function(x){ x.disabled = false; }); alert('Non riuscito: ' + e.message); });
    }
    hint('Consigliato: il titolare riceve un\'email con un link (vale 30 minuti) e sceglie lui la nuova password.');
    btn('Invia link di reset via email', '', function(){
      if (!window.confirm('Mandare a ' + c.name + ' l\'email per scegliere una nuova password?')) return;
      call('link', function(r){
        box.innerHTML = ''; document.getElementById('actTitle').textContent = 'Email inviata';
        sub.textContent = 'Il link è partito verso ' + r.email + '. Vale 30 minuti e funziona una sola volta.';
      });
    });
    hint('Se non ha accesso all\'email: genero una password provvisoria e te la mostro una sola volta. Poi gliela comunichi tu e lui la cambia da Impostazioni.');
    btn('Genera password provvisoria', 'ghost', function(){
      if (!window.confirm('Cambiare subito la password di ' + c.name + '? Quella vecchia smette di funzionare.')) return;
      call('temp', function(r){
        box.innerHTML = ''; document.getElementById('actTitle').textContent = 'Nuova password';
        sub.textContent = 'Account: ' + r.email + '. Questa password si vede solo adesso: copiala e mandala al titolare.';
        var pw = document.createElement('div'); pw.textContent = r.password;
        pw.style.cssText = 'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.35rem;font-weight:700;letter-spacing:.04em;text-align:center;padding:18px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line2);user-select:all;-webkit-user-select:all;word-break:break-all;';
        box.appendChild(pw);
        var cp = btn('Copia password', '', function(){
          function ok(){ cp.textContent = 'Copiata ✓'; }
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(r.password).then(ok, function(){ window.prompt('Copia la password:', r.password); });
          else window.prompt('Copia la password:', r.password);
        });
      });
    });
    btn('Indietro', 'ghost', function(){ openActions(c); });
  }

  window.setClients = function(list){
    CLIENTS = list.map(function(x){ var o = {}; for (var k in x) o[k] = x[k]; o.renew = x.renew ? new Date(x.renew) : null; return o; });
    renderAll();
  };
  renderAll();
};
</script>
<script>


window.liaReload = function(){
  return window.liaApi('/api/admin/clients').then(function(j){
    var b = document.getElementById('liaBanner'); if (b) b.remove();
    window.setClients(j.clients);
  }).catch(function(e){ window.liaBanner('Non riesco a caricare i clienti: ' + e.message); });
};
window.startClients();
window.liaReload();
</script>
