<!doctype html><html lang="it"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Lia – Accesso attività</title><style>
:root{--bg:#050608;--card:#0E131B;--card2:#161D29;--line:#1C2532;--line2:#2A3648;--ink:#F9F6F0;--muted:#9BA6B5;--accent:#2DD2DC;--on:#031016;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif}.box{max-width:420px;margin:12vh auto 0;padding:0 20px}.card{border-radius:24px;border:1px solid var(--line);background:var(--card);padding:30px 24px}.logo{display:block;width:190px;height:auto;margin:0 auto 20px;object-fit:contain}.card h1{text-align:center;font-size:1.3rem;margin:0 0 5px}.sub{text-align:center;color:var(--muted);font-size:.92rem;margin:0 0 22px}.card label{display:block;font-size:.84rem;color:var(--muted);margin:14px 0 6px}.inp{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font:inherit;font-size:1rem}.inp:focus{outline:2px solid var(--accent);outline-offset:1px}.btn{width:100%;min-height:48px;margin-top:20px;border:0;border-radius:14px;background:var(--accent);color:var(--on);font:inherit;font-weight:700;font-size:1rem;cursor:pointer}.btn:disabled{opacity:.65}.err{display:none;margin-top:14px;background:#3a1c1c;color:#ffb4b4;padding:10px 14px;border-radius:12px;font-size:.9rem}</style></head><body><div class="box"><div class="card"><img class="logo" src="/lia-logo.jpg" alt="Lia"><h1>Accesso alla tua attività</h1><p class="sub">Entra con l’email e la password della tua attività.</p><form id="f"><label for="email">Email</label><input class="inp" id="email" type="email" autocomplete="username" required><label for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password" required><button class="btn" id="go">Entra</button><div class="err" id="err"></div></form></div></div><script>
(function(){var f=document.getElementById("f"),go=document.getElementById("go"),err=document.getElementById("err");function show(m){err.textContent=m;err.style.display="block"}fetch("/api/business-auth").then(function(r){if(r.ok)location.replace("/api/agenda")});f.addEventListener("submit",function(e){e.preventDefault();err.style.display="none";go.disabled=true;go.textContent="Controllo…";fetch("/api/business-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("pw").value})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Accesso non riuscito");location.replace("/api/agenda")})}).catch(function(e){show(e.message);go.disabled=false;go.textContent="Entra"})})})();
</script></body></html>
