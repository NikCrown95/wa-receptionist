<!doctype html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prenolia – Accedi</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--logo:url("/brand/prenolia-dark.png");--bg:#050608;--card:#0E131B;--card2:#161D29;--line:#1C2532;--line2:#2A3648;--ink:#F9F6F0;--muted:#9BA6B5;--accent:#2DD2DC;--on-accent:#031016;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,p{margin:0}button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.loginbox{max-width:420px;margin:12vh auto 0;padding:0 20px}
.card{border-radius:24px;border:1px solid var(--line);background:var(--card);padding:28px 24px}
.logo{display:block;width:176px;height:42px;margin:0 auto 18px;background:var(--logo) center / contain no-repeat}
h1{font-size:1.3rem;text-align:center;margin:0 0 4px;letter-spacing:-0.01em}
.sub{text-align:center;color:var(--muted);font-size:.92rem;margin:0 0 20px}
label{display:block;font-size:.84rem;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font:inherit;font-size:1rem}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{width:100%;min-height:48px;margin-top:20px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.btn:disabled{opacity:.65;cursor:default}
.err{margin-top:14px;background:#3a1c1c;color:#ffb4b4;padding:10px 14px;border-radius:12px;font-size:.9rem;line-height:1.4;display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:.88rem}
.chk{white-space:nowrap;display:flex;align-items:center;gap:10px;margin:0;color:var(--ink);font-size:.9rem;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent);margin:0}
a.lnk,button.lnk{color:var(--accent);text-decoration:none;font-size:.9rem;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;min-height:44px;display:inline-flex;align-items:center}
.code{letter-spacing:.35em;text-align:center;font-size:1.4rem;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px;text-align:center}
.hide{display:none}
@media(max-width:520px){.loginbox{margin-top:9vh}.card{padding:26px 20px}}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;pointer-events:none;transition:opacity .4s}
.ov.on{opacity:1;pointer-events:auto}
.mk{position:relative;width:104px;height:104px;display:grid;place-items:center}
.mk img{width:64px;height:auto;position:relative;animation:breathe 2.2s ease-in-out infinite}
.mk::before,.mk::after{content:"";position:absolute;inset:0;border-radius:50%}
.mk::before{border:1px solid var(--line2)}
.mk::after{border:2px solid transparent;border-top-color:var(--accent);border-right-color:rgba(45,210,220,.25);animation:spin 1.3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
.ov .hello{font-size:1.15rem;font-weight:600;letter-spacing:-.01em;text-align:center}
.ov .bar{width:170px;height:3px;border-radius:3px;background:var(--line2);overflow:hidden}
.ov .bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),#E6C77A)}
.ov .msg{color:var(--muted);font-size:.9rem;text-align:center;min-height:1.4em;transition:opacity .25s}
@media(prefers-reduced-motion:reduce){.mk::after,.mk img{animation-duration:3s}}
</style>
<link rel="preload" as="image" href="/brand/mark.png">
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="loginbox">
  <div class="card">
    <span class="logo" role="img" aria-label="Prenolia"></span>
    <h1>Bentornato</h1>
    <p class="sub">La tua agenda ti aspetta.</p>
    <form id="f" autocomplete="on">
      <label for="email">Email</label>
      <input class="inp" id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" required>
      <label for="pw">Password</label>
      <input class="inp" id="pw" name="password" type="password" autocomplete="current-password" required>
      <div class="row">
        <label class="chk" for="rem"><input type="checkbox" id="rem"> Resta connesso</label>
        <a class="lnk" href="/reset.html">Password dimenticata?</a>
      </div>
      <button class="btn" id="go" type="submit">Entra</button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <form id="f2" class="hide" autocomplete="off">
      <label for="code">Codice di verifica</label>
      <input class="inp code" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required>
      <p class="hint">Inserisci il codice della tua app di autenticazione. Hai perso il telefono? Usa un codice di emergenza.</p>
      <button class="btn" id="go2" type="submit">Conferma</button>
      <div class="row" style="justify-content:center"><button class="lnk" type="button" id="back">Indietro</button></div>
      <div class="err" id="err2" role="alert"></div>
    </form>
    <p class="hint"><a href="/privacy" style="color:inherit">Privacy</a> · <a href="/termini" style="color:inherit">Termini</a></p>
  </div>
</div>
<div class="ov" id="ov" aria-live="polite">
  <div class="mk"><img src="/brand/mark.png" alt=""></div>
  <p class="hello">Bentornato</p>
  <div class="bar"><i id="bar"></i></div>
  <p class="msg" id="msg"></p>
</div>
<script>
(function(){
var f=document.getElementById("f"),f2=document.getElementById("f2"),go=document.getElementById("go"),go2=document.getElementById("go2"),err=document.getElementById("err"),err2=document.getElementById("err2"),sub=document.querySelector(".sub"),challenge="";
function show(el,m){el.textContent=m;el.style.display="block"}
var ov=document.getElementById("ov"),bar=document.getElementById("bar"),msg=document.getElementById("msg"),timers=[],steps=["Verifico le credenziali…","Carico i tuoi appuntamenti…","Preparo la tua agenda…"];
function loading(on){timers.forEach(clearTimeout);timers=[];
if(!on){ov.classList.remove("on");return}
ov.classList.add("on");msg.style.opacity=1;msg.textContent=steps[0];bar.style.transition="none";bar.style.width="0";void bar.offsetWidth;bar.style.transition="width 2.6s cubic-bezier(.3,.7,.2,1)";bar.style.width="92%";
[1,2].forEach(function(k){timers.push(setTimeout(function(){msg.style.opacity=0;timers.push(setTimeout(function(){msg.textContent=steps[k];msg.style.opacity=1},220))},k*950))})}
function enter(j){if(!ov.classList.contains("on"))loading(true);bar.style.transition="width .3s ease-out";bar.style.width="100%";location.replace("/api/agenda?t="+j.agenda_token)}
function post(url,data){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.error||"Accesso non riuscito");e.restart=j.restart;throw e}return j})})}
fetch("/api/business-auth").then(function(r){if(r.ok)r.json().then(function(j){if(j.agenda_token)enter(j)})});
f.addEventListener("submit",function(e){e.preventDefault();err.style.display="none";go.disabled=true;go.textContent="Un attimo…";loading(true);
post("/api/business-auth",{email:document.getElementById("email").value,password:document.getElementById("pw").value,remember:document.getElementById("rem").checked}).then(function(j){
if(j.need_code){loading(false);challenge=j.challenge;f.classList.add("hide");f2.classList.remove("hide");sub.textContent="Un ultimo passaggio.";document.getElementById("code").focus();return}
enter(j)}).catch(function(e){loading(false);show(err,e.message)}).then(function(){go.disabled=false;go.textContent="Entra"})});
f2.addEventListener("submit",function(e){e.preventDefault();err2.style.display="none";go2.disabled=true;go2.textContent="Un attimo…";loading(true);
post("/api/business-auth?action=verify2fa",{challenge:challenge,code:document.getElementById("code").value}).then(enter).catch(function(e){loading(false);show(err2,e.message);if(e.restart)setTimeout(back,1800)}).then(function(){go2.disabled=false;go2.textContent="Conferma"})});
function back(){challenge="";f2.classList.add("hide");f.classList.remove("hide");sub.textContent="La tua agenda ti aspetta.";document.getElementById("code").value="";err2.style.display="none"}
document.getElementById("back").addEventListener("click",back);
})();
</script></body></html>
