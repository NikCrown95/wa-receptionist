<title>Registrazione Prenolia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: un passo per schermata, barra di avanzamento in alto, pulsanti Indietro/Avanti in fondo. */
:root{--bg:#050608;--card:#0E131B;--card2:#161D29;--line:#1C2532;--line2:#2A3648;--ink:#F9F6F0;--muted:#9BA6B5;--accent:#2DD2DC;--blue:#2F7BFF;--on-accent:#031016;--gold:#E6C77A;--err:#ffb4b4;
  --grad:linear-gradient(135deg,#2DD2DC,#2F7BFF);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(520px 320px at 85% -40px,rgba(45,210,220,.2),transparent 70%),radial-gradient(480px 360px at -10% 120px,rgba(47,123,255,.14),transparent 70%);background-repeat:no-repeat;
  padding-block:26px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(360px,470px) minmax(0,1fr);gap:56px;align-items:start}
.side{position:sticky;top:28px;display:flex;flex-direction:column;gap:30px;padding-top:6px}
.side .logo{margin:0;width:150px}
.side h2{font-size:1.9rem;line-height:1.12;font-weight:800;letter-spacing:-.03em;text-wrap:balance;margin:0}
.side .lead{max-width:30ch;margin:0}
.pane{max-width:600px;width:100%;display:flex;flex-direction:column;gap:22px;padding-top:6px}
.steps.bar{display:none}
@media (max-width:900px){
  .shell{display:block;max-width:460px}
  .side{position:static;gap:16px;margin-bottom:24px}
  .side h2,.side .lead{display:none}
  .side .logo{margin:0 auto}
  .side .orbrow{flex-direction:row;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 16px}
  .side .orb{width:84px;height:84px}
  .side .orb .pc b{font-size:1.1rem}.side .orb .pc span{display:none}
  .side .feed .ft{font-size:1.05rem;margin-top:0}.side .feed .fx{font-size:.8rem;margin-top:3px}.side .feed .fk{display:none}
}

.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line2)}
.steps i.on{background:var(--grad)}
.stepl{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:1.7rem;line-height:1.14;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.lead{color:var(--muted);font-size:.96rem}
.head{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;grid-template-columns:52px 1fr 24px;gap:16px;align-items:center;padding:16px;border-radius:22px;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(var(--line),var(--line)) border-box}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--card2);color:var(--accent);border:1px solid var(--line2)}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.opt b{display:block;font-size:1.02rem;font-weight:700}
.opt .d{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.opt[aria-pressed="true"]{background:linear-gradient(135deg,#102430,#0E1A2A) padding-box,var(--grad) border-box;box-shadow:0 10px 34px -12px rgba(45,210,220,.45)}
.opt[aria-pressed="true"] .ic{background:var(--grad);color:var(--on-accent);border-color:transparent}
.opt[aria-disabled="true"]{cursor:default;opacity:.62}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;justify-self:end}
.opt[aria-pressed="true"] .rd{border:0;background:var(--grad)}
.opt[aria-pressed="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.opt[aria-disabled="true"] .rd{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles .opt{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:182px;padding:16px;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 100%,rgba(47,123,255,.14),transparent 60%) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(var(--line),var(--line)) border-box}
.tiles .opt .wm{position:absolute;right:-18px;bottom:-18px;width:112px;height:112px;opacity:.07;pointer-events:none}
.tiles .opt .wm svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.tiles .opt .ic{width:46px;height:46px;border-radius:14px}
.tiles .opt .ic svg{width:24px;height:24px}
